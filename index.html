// REFLECT TAB - Habits + Weight
// ═══════════════════════════════════════
function habitToggle(habitId, date){
  smInit();
  if(!state.diary.habitLog[habitId]) state.diary.habitLog[habitId]={};
  const cur=state.diary.habitLog[habitId][date]||'';
  // Cycle: '' -> 'done' -> 'missed' -> 'skip' -> ''
  const next=cur===''?'done':cur==='done'?'missed':cur==='missed'?'skip':'';
  if(next==='') delete state.diary.habitLog[habitId][date];
  else state.diary.habitLog[habitId][date]=next;
  saveState();
  render();
}
function habitAdd(){
  const name=prompt('Habit name?');
  if(!name||!name.trim()) return;
  const goal=parseInt(prompt('Weekly goal (1-7 times per week)?','5'))||5;
  smInit();
  state.diary.habitsList.push({
    id:'h_'+Math.random().toString(36).slice(2,9),
    name:name.trim(),
    weeklyGoal:Math.min(7,Math.max(1,goal)),
    createdAt:todayISO(),
    color:'#5A9E7E'
  });
  saveState();render();
}
function habitEdit(habitId){
  const h=state.diary.habitsList.find(x=>x.id===habitId);
  if(!h) return;
  const name=prompt('Habit name:',h.name);
  if(name===null) return;
  const goal=parseInt(prompt('Weekly goal (1-7):',h.weeklyGoal))||h.weeklyGoal;
  h.name=name.trim()||h.name;
  h.weeklyGoal=Math.min(7,Math.max(1,goal));
  saveState();render();
}
function habitDelete(habitId){
  if(!confirm('Delete this habit and all its log entries?')) return;
  state.diary.habitsList=state.diary.habitsList.filter(x=>x.id!==habitId);
  delete state.diary.habitLog[habitId];
  saveState();render();
}
function weightLog(){
  const inp=document.getElementById('weight-input');
  if(!inp) return;
  const v=parseFloat(inp.value);
  if(!v||v<30||v>300){alert('Enter a valid weight in kg');return;}
  smInit();
  state.diary.weights[todayISO()]=v;
  saveState();render();
}

function renderReflect(){
  smInit();
  const habits=state.diary.habitsList||[];
  const log=state.diary.habitLog||{};
  const weights=state.diary.weights||{};
  const today=todayISO();
  const todayObj=new Date(today+'T12:00:00');
  
  // Compute today's status per habit
  const todayStatus=habits.map(h=>({
    habit:h,
    status:(log[h.id]||{})[today]||''
  }));
  const todayDone=todayStatus.filter(s=>s.status==='done').length;
  
  // Compute streak per habit (consecutive 'done' days backwards)
  function getStreak(habitId){
    const hl=log[habitId]||{};
    let streak=0;
    let d=new Date(today+'T12:00:00');
    for(let i=0;i<365;i++){
      const ds=d.toISOString().slice(0,10);
      if(hl[ds]==='done'){streak++;}
      else if(hl[ds]==='skip'){/* skip-day doesn't break streak */}
      else if(i===0){/* today not yet logged is OK */}
      else break;
      d.setDate(d.getDate()-1);
    }
    return streak;
  }
  
  // Get last 7 days for the bar
  const last7=[];
  for(let i=6;i>=0;i--){
    const d=new Date(todayObj);d.setDate(d.getDate()-i);
    last7.push(d.toISOString().slice(0,10));
  }
  
  let h=`<div class="fade-in">
    <div class="page-header" style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
      <h1>Reflect</h1>
      <span style="font-size:11px;color:var(--text-light)">Daily habits, weight, and the green line</span>
    </div>`;
  
  // ── 1. TODAY'S HABITS ──
  h+=`<div class="card" style="padding:18px;margin-bottom:14px">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
      <div style="font-size:13px;font-weight:700">Today's habits</div>
      <span style="font-size:11px;color:var(--text-light)">${todayObj.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'})}</span>
      <span style="margin-left:auto;font-size:11px;color:var(--text-mid);font-weight:600">${todayDone} / ${habits.length}</span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px">`;
  
  todayStatus.forEach(({habit,status})=>{
    const streak=getStreak(habit.id);
    const isDone=status==='done';
    const isMissed=status==='missed';
    const isSkip=status==='skip';
    const bg=isDone?'var(--accent-soft)':isMissed?'rgba(207,111,111,.08)':isSkip?'rgba(148,163,184,.08)':'var(--card)';
    const border=isDone?'1px solid #5A9E7E':isMissed?'1px solid rgba(207,111,111,.4)':'1px solid var(--border)';
    const dotBg=isDone?'#5A9E7E':isMissed?'#CF6F6F':isSkip?'#94A3B8':'transparent';
    const dotBorder=isDone||isMissed||isSkip?'none':'1.5px solid var(--border-vis)';
    const icon=isDone?'\u2713':isMissed?'\u2715':isSkip?'\u2014':'';
    
    h+=`<div onclick="habitToggle('${habit.id}','${today}')" oncontextmenu="event.preventDefault();habitEdit('${habit.id}')" style="background:${bg};border:${border};border-radius:8px;padding:10px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;transition:all .15s" title="Click to cycle: pending → done → missed → skip">
      <div style="width:24px;height:24px;border-radius:50%;background:${dotBg};border:${dotBorder};display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700">${icon}</div>
      <div style="font-size:11px;font-weight:600;color:${isDone||isMissed||isSkip?'var(--text)':'var(--text-mid)'};line-height:1.2">${esc(habit.name)}</div>
      <div style="font-size:9px;color:var(--text-light)">${streak>0?streak+' day streak':'tap to log'}</div>
    </div>`;
  });
  
  h+=`</div>`;
  
  // Weekly bar (last 7 days, summarised across habits)
  h+=`<div style="margin-top:14px"><div style="font-size:9.5px;color:var(--text-light);margin-bottom:6px;display:flex;justify-content:space-between"><span>Last 7 days</span><span>tap a square to log earlier</span></div>
    <div style="display:flex;gap:3px">`;
  last7.forEach((d,i)=>{
    const dObj=new Date(d+'T12:00:00');
    const totalForDay=habits.length;
    const doneForDay=habits.filter(h=>(log[h.id]||{})[d]==='done').length;
    const missForDay=habits.filter(h=>(log[h.id]||{})[d]==='missed').length;
    const ratio=totalForDay>0?doneForDay/totalForDay:0;
    const bg=ratio>=0.8?'#5A9E7E':ratio>=0.5?'#D4A04A':ratio>0?'#CF6F6F':'var(--border-vis)';
    const op=missForDay+doneForDay>0?1:0.5;
    const isToday=d===today;
    h+=`<div style="flex:1;height:34px;background:${bg};opacity:${op};border-radius:4px;position:relative;cursor:pointer;${isToday?'outline:2px solid var(--accent);outline-offset:1px':''}" title="${dObj.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'})} - ${doneForDay}/${totalForDay} done">
      <span style="position:absolute;bottom:-14px;left:0;right:0;text-align:center;font-size:9px;color:var(--text-light)">${dObj.toLocaleDateString('en-GB',{weekday:'short'}).slice(0,1)}</span>
    </div>`;
  });
  h+=`</div></div>`;
  h+=`</div>`;
  
  // ── 2. MONTHLY GRID ──
  // Allow scrolling months
  if(!state.diary.reflectMonth) state.diary.reflectMonth=today.slice(0,7); // YYYY-MM
  const [year,month]=state.diary.reflectMonth.split('-').map(Number);
  const daysInMonth=new Date(year,month,0).getDate();
  const firstDayOfMonth=new Date(year,month-1,1);
  const monthDays=[];
  for(let i=1;i<=daysInMonth;i++){
    const d=new Date(year,month-1,i);
    monthDays.push({day:i,iso:d.toISOString().slice(0,10),dow:d.getDay()});
  }
  
  function shiftMonth(delta){
    const d=new Date(year,month-1+delta,1);
    state.diary.reflectMonth=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    saveState();render();
  }
  // Make available globally
  window.shiftReflectMonth=shiftMonth;
  
  h+=`<div class="card" style="padding:16px;margin-bottom:14px;overflow-x:auto">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
      <div style="font-size:13px;font-weight:700">Monthly grid</div>
      <span style="font-size:11px;color:var(--text-light)">tap cell: pending → done → missed → skip</span>
      <div style="margin-left:auto;display:flex;gap:4px;align-items:center">
        <button onclick="window.shiftReflectMonth(-1)" style="background:none;border:1px solid var(--border-vis);border-radius:4px;padding:3px 8px;cursor:pointer;font-family:var(--font);font-size:11px">\u2039</button>
        <span style="font-size:12px;font-weight:600;padding:0 8px;min-width:120px;text-align:center">${firstDayOfMonth.toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</span>
        <button onclick="window.shiftReflectMonth(1)" style="background:none;border:1px solid var(--border-vis);border-radius:4px;padding:3px 8px;cursor:pointer;font-family:var(--font);font-size:11px">\u203A</button>
        <button onclick="state.diary.reflectMonth='${today.slice(0,7)}';saveState();render()" style="background:none;border:1px solid var(--border-vis);border-radius:4px;padding:3px 8px;cursor:pointer;font-family:var(--font);font-size:11px;margin-left:4px">today</button>
      </div>
    </div>
    
    <table style="border-collapse:separate;border-spacing:0;font-size:11px;width:100%;min-width:680px">
      <thead>
        <tr>
          <th style="text-align:left;padding:6px 8px;font-weight:600;color:var(--text-mid);font-size:10px;background:var(--card);border-bottom:1px solid var(--border-vis);position:sticky;left:0;z-index:2;min-width:130px">Habit</th>`;
  
  monthDays.forEach(({day,iso,dow})=>{
    const isWeekend=dow===0||dow===6;
    const isToday=iso===today;
    h+=`<th style="padding:4px 0;font-weight:400;font-size:9px;color:${isToday?'var(--accent)':'var(--text-light)'};border-bottom:1px solid var(--border-vis);width:20px;text-align:center;${isWeekend?'background:rgba(0,0,0,.03)':''};${isToday?'background:rgba(91,141,239,.12);font-weight:700':''}">${day}</th>`;
  });
  h+=`<th style="padding:6px 8px;font-weight:600;color:var(--text-mid);font-size:10px;border-bottom:1px solid var(--border-vis);border-left:1px solid var(--border-vis);text-align:center;padding-left:12px;min-width:50px">Goal</th>
      <th style="padding:6px 8px;font-weight:600;color:var(--text-mid);font-size:10px;border-bottom:1px solid var(--border-vis);text-align:center;min-width:50px">Done</th>
      <th style="padding:6px 8px;font-weight:600;color:var(--text-mid);font-size:10px;border-bottom:1px solid var(--border-vis);text-align:center;min-width:50px">Hit</th>
    </tr></thead><tbody>`;
  
  habits.forEach(habit=>{
    const hl=log[habit.id]||{};
    let monthDone=0,monthMissed=0,monthSkip=0;
    monthDays.forEach(({iso})=>{
      const st=hl[iso];
      if(st==='done')monthDone++;
      else if(st==='missed')monthMissed++;
      else if(st==='skip')monthSkip++;
    });
    // Monthly goal = weekly goal × ~4.3 weeks per month
    const monthlyGoal=Math.round(habit.weeklyGoal*daysInMonth/7);
    const remainingDays=monthDays.filter(({iso})=>iso>today).length;
    const verdict = monthDone>=monthlyGoal ? 'Yes' : (monthDone+remainingDays<monthlyGoal ? 'No' : '\u2026');
    const verdictBg=verdict==='Yes'?'#EAF3DE':verdict==='No'?'#FCEBEB':'#FAEEDA';
    const verdictColor=verdict==='Yes'?'#3B6D11':verdict==='No'?'#A32D2D':'#854F0B';
    
    h+=`<tr>
      <td style="padding:6px 8px;font-weight:600;font-size:11.5px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;left:0;z-index:1;display:flex;align-items:center;gap:6px">
        <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(habit.name)}</span>
        <button onclick="habitEdit('${habit.id}')" style="background:none;border:none;cursor:pointer;font-size:10px;color:var(--text-light);opacity:.5;padding:0" title="Edit habit">\u270E</button>
        <button onclick="habitDelete('${habit.id}')" style="background:none;border:none;cursor:pointer;font-size:11px;color:var(--text-light);opacity:.4;padding:0" title="Delete habit">\u00D7</button>
      </td>`;
    monthDays.forEach(({day,iso,dow})=>{
      const st=hl[iso];
      const isWeekend=dow===0||dow===6;
      const isFuture=iso>today;
      const isToday=iso===today;
      let bg='transparent',content='';
      if(st==='done'){bg='#5A9E7E';content='';}
      else if(st==='missed'){bg='#CF6F6F';content='';}
      else if(st==='skip'){bg='#CBD5E1';content='';}
      else if(isWeekend){bg='rgba(0,0,0,.03)';}
      h+=`<td onclick="${isFuture?'':"habitToggle('"+habit.id+"','"+iso+"')"}" style="background:${bg};border:1px solid #fff;cursor:${isFuture?'default':'pointer'};${isToday?'outline:1.5px solid var(--accent);outline-offset:-1.5px':''};${isFuture?'opacity:.4':''};height:22px" title="${iso} - ${st||'pending'}"></td>`;
    });
    h+=`<td style="text-align:center;font-size:11px;border-left:1px solid var(--border-vis);padding:6px 8px;padding-left:12px;border-bottom:1px solid var(--border)">${monthlyGoal}<div style="font-size:8.5px;color:var(--text-light);font-weight:400">(${habit.weeklyGoal}/wk)</div></td>
      <td style="text-align:center;font-size:12px;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--border)">${monthDone}</td>
      <td style="text-align:center;padding:6px 8px;border-bottom:1px solid var(--border)"><span style="background:${verdictBg};color:${verdictColor};font-size:10px;padding:3px 9px;border-radius:10px;font-weight:600">${verdict}</span></td>
    </tr>`;
  });
  
  h+=`</tbody></table>
    
    <div style="display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:10px;border-top:1px solid var(--border);font-size:10px;color:var(--text-light);flex-wrap:wrap">
      <span style="display:flex;align-items:center;gap:4px"><span style="display:inline-block;width:11px;height:11px;background:#5A9E7E;border-radius:2px"></span>done</span>
      <span style="display:flex;align-items:center;gap:4px"><span style="display:inline-block;width:11px;height:11px;background:#CF6F6F;border-radius:2px"></span>missed</span>
      <span style="display:flex;align-items:center;gap:4px"><span style="display:inline-block;width:11px;height:11px;background:#CBD5E1;border-radius:2px"></span>skip-day</span>
      <button onclick="habitAdd()" style="margin-left:auto;background:var(--accent);color:#fff;border:none;border-radius:4px;padding:5px 12px;cursor:pointer;font-family:var(--font);font-size:11px;font-weight:600">+ Add habit</button>
    </div>
  </div>`;
  
  // ── 3. SUCCESS RATE — overall passes/tries × 100 ──
  h+=`<div class="card" style="padding:18px;margin-bottom:14px">
    <div style="font-size:13px;font-weight:700;margin-bottom:4px">Success rate</div>
    <div style="font-size:11px;color:var(--text-light);margin-bottom:14px">Passes / tries × 100 across all logged history. Skip-days don't count as a try.</div>`;
  
  habits.forEach(habit=>{
    const hl=log[habit.id]||{};
    let pass=0,tries=0;
    Object.values(hl).forEach(st=>{
      if(st==='done'){pass++;tries++;}
      else if(st==='missed'){tries++;}
    });
    const rate=tries>0?Math.round(pass/tries*100):0;
    const rateColor=rate>=80?'#5A9E7E':rate>=50?'#D4A04A':'#CF6F6F';
    const skipCount=Object.values(hl).filter(s=>s==='skip').length;
    
    h+=`<div style="margin-bottom:10px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">
        <span style="font-size:12px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(habit.name)}</span>
        <span style="font-size:11px;color:var(--text-light)">${pass} / ${tries} tries${skipCount?' · '+skipCount+' skipped':''}</span>
        <span style="font-size:14px;font-weight:700;color:${rateColor};min-width:50px;text-align:right">${tries>0?rate+'%':'\u2014'}</span>
      </div>
      <div style="height:6px;background:var(--border-vis);border-radius:3px;overflow:hidden">
        <div style="width:${rate}%;height:100%;background:${rateColor};border-radius:3px;transition:width .5s"></div>
      </div>
    </div>`;
  });
  
  if(habits.length===0){
    h+=`<div style="text-align:center;color:var(--text-light);font-size:11px;padding:14px">No habits yet. <button onclick="habitAdd()" style="background:var(--accent);color:#fff;border:none;border-radius:4px;padding:5px 12px;cursor:pointer;font-family:var(--font);font-size:11px;font-weight:600;margin-left:8px">+ Add habit</button></div>`;
  }
  
  h+=`</div>`;
  
  // ── 4. WEIGHT TRACKER ──
  const weightDates=Object.keys(weights).sort();
  const latestWeight=weightDates.length?weights[weightDates[weightDates.length-1]]:null;
  const TARGET=85;
  const delta=latestWeight!==null?(latestWeight-TARGET):null;
  
  h+=`<div class="card" style="padding:18px;margin-bottom:14px">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
      <div style="font-size:13px;font-weight:700">Weight</div>
      <div style="display:flex;align-items:baseline;gap:4px;margin-left:auto">
        ${latestWeight!==null?`<span style="font-size:20px;font-weight:700">${latestWeight.toFixed(1)}</span><span style="font-size:11px;color:var(--text-light)">kg</span>`:'<span style="font-size:11px;color:var(--text-light);font-style:italic">no entries yet</span>'}
        ${delta!==null?`<span style="font-size:11px;color:${delta<=0?'#5A9E7E':'var(--text-mid)'};margin-left:8px;font-weight:600">${delta>0?'+':''}${delta.toFixed(1)} to target</span>`:''}
      </div>
    </div>
    
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">
      <input type="number" id="weight-input" placeholder="${latestWeight!==null?latestWeight.toFixed(1):'88.0'}" step="0.1" style="width:90px;height:32px;padding:0 10px;font-size:13px;border:1px solid var(--border-vis);border-radius:6px;background:var(--card);font-family:var(--font);font-weight:600" onkeydown="if(event.key==='Enter')weightLog()">
      <span style="font-size:11px;color:var(--text-light)">log today's weight (kg)</span>
      <button onclick="weightLog()" style="margin-left:auto;height:32px;padding:0 14px;background:var(--accent);color:#fff;border:none;border-radius:6px;cursor:pointer;font-family:var(--font);font-size:12px;font-weight:600">Log</button>
    </div>`;
  
  if(weightDates.length>0){
    // Build chart
    const minW=Math.min(...Object.values(weights),TARGET-2);
    const maxW=Math.max(...Object.values(weights),TARGET+5);
    const cw=900,ch=240,padL=44,padR=20,padT=16,padB=36;
    const plotW=cw-padL-padR,plotH=ch-padT-padB;
    const minDate=new Date(weightDates[0]+'T12:00:00');
    const maxDate=new Date(weightDates[weightDates.length-1]+'T12:00:00');
    const dateSpan=Math.max(maxDate-minDate,86400000);
    const xFor=d=>padL+((new Date(d+'T12:00:00')-minDate)/dateSpan)*plotW;
    const yFor=w=>padT+(1-(w-minW)/(maxW-minW))*plotH;
    
    h+=`<svg viewBox="0 0 ${cw} ${ch}" style="width:100%;height:auto;display:block;font-family:var(--font)">`;
    
    // Y gridlines for whole kg values
    const yStart=Math.ceil(minW),yEnd=Math.floor(maxW);
    for(let y=yStart;y<=yEnd;y++){
      if((y-yStart)%2!==0&&yEnd-yStart>6)continue;
      const py=yFor(y);
      h+=`<line x1="${padL}" y1="${py}" x2="${cw-padR}" y2="${py}" stroke="var(--border)" stroke-width="1" stroke-dasharray="2,3" opacity="0.7"/>`;
      h+=`<text x="${padL-8}" y="${py+3}" text-anchor="end" font-size="10" fill="var(--text-light)">${y}</text>`;
    }
    
    // Target line at 85kg
    const targetY=yFor(TARGET);
    h+=`<line x1="${padL}" y1="${targetY}" x2="${cw-padR}" y2="${targetY}" stroke="#5A9E7E" stroke-width="2" stroke-dasharray="6,4" opacity="0.85"/>`;
    h+=`<text x="${cw-padR-4}" y="${targetY-4}" text-anchor="end" font-size="11" fill="#5A9E7E" font-weight="700">85 kg target</text>`;
    
    // Data path
    let pathD='';
    weightDates.forEach((d,i)=>{
      pathD+=(i===0?'M':' L')+xFor(d)+','+yFor(weights[d]);
    });
    h+=`<path d="${pathD}" fill="none" stroke="#185FA5" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    
    // Dots
    weightDates.forEach(d=>{
      h+=`<circle cx="${xFor(d)}" cy="${yFor(weights[d])}" r="3" fill="#185FA5" stroke="var(--card)" stroke-width="1.5"><title>${new Date(d+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}: ${weights[d].toFixed(1)} kg</title></circle>`;
    });
    
    // X axis date labels (max 6)
    const tickCount=Math.min(weightDates.length,6);
    for(let i=0;i<tickCount;i++){
      const idx=Math.round(i*(weightDates.length-1)/Math.max(tickCount-1,1));
      const d=weightDates[idx];
      const x=xFor(d);
      const lbl=new Date(d+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'});
      h+=`<text x="${x}" y="${padT+plotH+18}" text-anchor="middle" font-size="10" fill="var(--text-mid)">${lbl}</text>`;
    }
    
    h+=`</svg>`;
    
    // Stats row
    const startW=weights[weightDates[0]];
    const lostKg=startW-latestWeight;
    h+=`<div style="display:flex;gap:12px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:11px;flex-wrap:wrap">
      <div><span style="color:var(--text-light)">Start</span> <span style="font-weight:600">${startW.toFixed(1)} kg</span></div>
      <div><span style="color:var(--text-light)">Now</span> <span style="font-weight:600">${latestWeight.toFixed(1)} kg</span></div>
      <div><span style="color:var(--text-light)">Change</span> <span style="font-weight:600;color:${lostKg>0?'#5A9E7E':lostKg<0?'#CF6F6F':'var(--text)'}">${lostKg>0?'\u2212':''}${Math.abs(lostKg).toFixed(1)} kg</span></div>
      <div style="margin-left:auto"><span style="color:var(--text-light)">${weightDates.length} entries</span></div>
    </div>`;
  } else {
    h+=`<div style="padding:20px;text-align:center;color:var(--text-light);font-size:11px;font-style:italic">Log your first weight above to start the chart.</div>`;
  }
  
  h+=`</div>`;
  
  h+=`</div>`;
  return h;
}

function renderDiary(){
  smInit();
  const td=state.diary.viewDate||todayISO();

  // ── PIN LOCK ──
  if(state.diary.pin && !state.diary.unlocked){
    return `<div class="sm-lock fade-in">
      <div class="sm-lock-card">
        <div style="font-size:48px;margin-bottom:12px;animation:smPulse 2s ease-in-out infinite;opacity:.4">\u25CF</div>
        <h2 style="font-size:20px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px">Self Map</h2>
        <p style="font-size:12px;opacity:.6;margin-bottom:20px">Your personal development journal is locked</p>
        <button class="btn" style="background:rgba(255,255,255,.12);color:rgba(255,255,255,.9);padding:10px 32px;font-size:13px;border:1px solid rgba(255,255,255,.15)" onclick="smUnlock()">Unlock with PIN</button>
      </div>
    </div>`;
  }

  const entry=smEntry(td);
  const filled=smFilledDates();
  const timeline=smTimeline();
  const isToday=td===todayISO();
  const pillarAvg=smAvgScores(td);
  const hasScores=Object.values(pillarAvg).some(v=>v>0);
  const totalAreas=getSMAllAreas().length;
  const filledAreas=getSMAllAreas().filter(a=>entry[a]&&(entry[a].repeat||entry[a].improve||entry[a].action||entry[a].score)).length;
  const todayPct=totalAreas?Math.round(filledAreas/totalAreas*100):0;

  // Hideable sections
  const hideMap={'sm-contrib':localStorage.getItem('sm-hide-contrib')==='1','sm-photo':localStorage.getItem('sm-hide-photo')==='1','sm-7habits':localStorage.getItem('sm-hide-7habits')==='1','sm-insights':localStorage.getItem('sm-hide-insights')==='1'};
  function smSectionToggle(key,label){
    if(hideMap[key]) return '<div style="margin-bottom:6px"><button style="background:none;border:none;cursor:pointer;font-size:9px;color:var(--text-light);font-family:var(--font);opacity:.4" onclick="localStorage.removeItem(\'sm-hide-'+key+'\');render()">'+label+'</button></div>';
    return '';
  }
  function smHideBtn(key){return '<button style="margin-left:auto;background:none;border:none;cursor:pointer;font-size:8px;color:var(--text-light);font-family:var(--font);opacity:.3" onclick="localStorage.setItem(\'sm-hide-'+key+'\',\'1\');render()">hide</button>';}

  let h=`<div class="fade-in">`;

  // ── HERO ──
  h+=`<div class="sm-hero">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">
      <div>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
          <span style="font-size:20px;font-weight:800;letter-spacing:-.02em">Self Map</span>
          ${state.diary.pin?`<button style="background:rgba(255,255,255,.08);border:none;border-radius:4px;color:rgba(255,255,255,.5);font-size:9px;padding:2px 6px;cursor:pointer;font-family:inherit" onclick="smLock()">\u25CF</button>`:`<button style="background:rgba(255,255,255,.08);border:none;border-radius:4px;color:rgba(255,255,255,.5);font-size:9px;padding:2px 6px;cursor:pointer;font-family:inherit" onclick="smSetPin()">\u25CB Set PIN</button>`}
        </div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:2px"><div style="font-size:13px;opacity:.85;font-weight:600">${new Date(td+'T12:00:00').toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</div>${isToday?`<span style="background:rgba(90,158,126,.2);color:#5A9E7E;font-size:9px;font-weight:700;padding:2px 7px;border-radius:4px;letter-spacing:.05em">TODAY · ${new Date(td+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</span>`:`<span style="background:rgba(255,255,255,.1);color:rgba(255,255,255,.6);font-size:9px;font-weight:700;padding:2px 7px;border-radius:4px;letter-spacing:.05em">PAST DAY · ${new Date(td+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</span>`}</div>
      </div>
      <div style="display:flex;gap:4px;align-items:center">
        <button class="btn" style="background:rgba(255,255,255,.1);color:rgba(255,255,255,.8);padding:5px 10px;font-size:10px;border:1px solid rgba(255,255,255,.08)" onclick="smQuickScore()">Quick score</button>
        <button class="btn" style="background:rgba(255,255,255,.06);color:rgba(255,255,255,.5);padding:5px 8px;font-size:10px;border:1px solid rgba(255,255,255,.05)" onclick="SM_PILLARS.forEach(function(p,i){state.diary['sm-p-'+i]='closed'});saveState();render()">Collapse</button>
        <button class="btn" style="background:rgba(255,255,255,.06);color:rgba(255,255,255,.5);padding:5px 8px;font-size:10px;border:1px solid rgba(255,255,255,.05)" onclick="SM_PILLARS.forEach(function(p,i){state.diary['sm-p-'+i]='open'});saveState();render()">Expand</button>
        <button class="btn" style="background:rgba(255,255,255,.06);color:rgba(255,255,255,.5);padding:5px 8px;font-size:10px;border:1px solid rgba(255,255,255,.05)" onclick="editSmPillars()">Edit</button>
        <button class="btn" style="background:${isToday?'rgba(90,158,126,.2)':'rgba(245,158,11,.25)'};color:${isToday?'rgba(255,255,255,.6)':'#FBBF24'};padding:4px 10px;font-size:10px;border:1px solid ${isToday?'rgba(255,255,255,.1)':'rgba(245,158,11,.4)'};font-weight:${isToday?'400':'600'}" onclick="state.diary.viewDate=null;render()" title="${isToday?'Already on today':'Jump back to today'}">\u25C9 Today</button>
        <input type="date" class="input" style="font-size:10px;padding:4px 6px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.85)" value="${td}" onchange="state.diary.viewDate=this.value;render()">
      </div>
    </div>

    <div style="display:flex;gap:16px;align-items:center">
      <div style="text-align:center;min-width:56px">
        <div style="font-size:28px;font-weight:800;line-height:1">${todayPct}<span style="font-size:14px;opacity:.5">%</span></div>
        <div style="font-size:8px;opacity:.4;text-transform:uppercase;letter-spacing:.06em;margin-top:2px">filled</div>
      </div>
      <div style="flex:1;display:flex;gap:3px;align-items:end;height:28px">`;
  SM_PILLARS.forEach(p=>{
    const avg=pillarAvg[p.name]||0;
    h+=`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px">
      <div style="width:100%;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden;height:20px;display:flex;align-items:end">
        <div style="width:100%;height:${avg*10}%;background:${p.color};border-radius:3px;transition:height .3s"></div>
      </div>
      <span style="font-size:7px;opacity:.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60px">${p.name.split('/')[0]}</span>
    </div>`;
  });
  h+=`</div>
      <div style="text-align:center;min-width:48px">
        <div style="font-size:16px;font-weight:800;line-height:1">${filled.length}</div>
        <div style="font-size:8px;opacity:.4;text-transform:uppercase;letter-spacing:.06em;margin-top:2px">entries</div>
      </div>
    </div>
  </div>`;

  // ── LIFE COUNTER ──
  if(state.diary.birthday){
    const bday=new Date(state.diary.birthday);
    const now=new Date();
    const thisYearBday=new Date(now.getFullYear(),bday.getMonth(),bday.getDate());
    if(thisYearBday<now) thisYearBday.setFullYear(thisYearBday.getFullYear()+1);
    const daysToNext=Math.ceil((thisYearBday-now)/864e5);
    const nextAge=thisYearBday.getFullYear()-bday.getFullYear();
    const livedDays=Math.floor((now-bday)/864e5);
    const remainingDays=Math.max(80*365-livedDays,0);
    const livedPct=(livedDays/(80*365)*100).toFixed(1);
    h+=`<div style="display:flex;gap:8px;margin-bottom:14px">
      <div style="flex:1;padding:10px 12px;border-radius:var(--radius-xs);background:var(--card);border:1px solid var(--border);text-align:center">
        <div style="font-size:18px;font-weight:700;color:var(--text)">${daysToNext}</div>
        <div style="font-size:8px;color:var(--text-light);text-transform:uppercase;letter-spacing:.05em">days to ${nextAge}</div>
      </div>
      <div style="flex:1;padding:10px 12px;border-radius:var(--radius-xs);background:var(--card);border:1px solid var(--border);text-align:center">
        <div style="font-size:18px;font-weight:700;color:var(--text)">${livedDays.toLocaleString()}</div>
        <div style="font-size:8px;color:var(--text-light);text-transform:uppercase;letter-spacing:.05em">days lived</div>
      </div>
      <div style="flex:1;padding:10px 12px;border-radius:var(--radius-xs);background:var(--card);border:1px solid var(--border);text-align:center">
        <div style="font-size:18px;font-weight:700;color:var(--text-mid)">${remainingDays.toLocaleString()}</div>
        <div style="font-size:8px;color:var(--text-light);text-transform:uppercase;letter-spacing:.05em">~days remaining</div>
      </div>
      <div style="flex:1;padding:10px 12px;border-radius:var(--radius-xs);background:var(--card);border:1px solid var(--border);text-align:center">
        <div style="font-size:18px;font-weight:700;color:var(--accent)">${livedPct}%</div>
        <div style="font-size:8px;color:var(--text-light);text-transform:uppercase;letter-spacing:.05em">of ~80 years</div>
      </div>
    </div>`;
  } else {
    h+=`<div style="margin-bottom:10px"><button class="btn btn-default" style="font-size:10px" onclick="var bd=prompt('Enter birthday (YYYY-MM-DD):');if(bd){state.diary.birthday=bd;saveState();render();}">Set birthday for life counter</button></div>`;
  }

  // ── RADAR ──
  if(hasScores){
    h+=`<div class="card" style="padding:16px;margin-bottom:14px;display:flex;align-items:center;justify-content:center">
      ${smRadarChart(pillarAvg, 280, td)}
    </div>`;
  }

  // ── PILLAR SECTIONS WITH TREND CHARTS ──

  // ── YEAR + MONTH BUTTONS ──
  const years=[...new Set(smFilledDates().map(d=>d.slice(0,4)))].sort();
  if(years.length>0){
    h+='<div style="margin-bottom:14px">';
    h+='<div style="display:flex;gap:4px;margin-bottom:6px;flex-wrap:wrap;align-items:center">';
    h+='<span style="font-size:10px;color:var(--text-light);font-weight:500;margin-right:2px">Year:</span>';
    years.forEach(y=>{
      const cnt=smFilledDates().filter(d=>d.startsWith(y)).length;
      h+='<button class="btn btn-default" style="font-size:10px;padding:3px 8px" onclick="yearlySummary('+y+')">'+y+' ('+cnt+')</button>';
    });
    h+='</div>';
    // Monthly buttons for the current viewing year
    const viewYear=td.slice(0,4);
    const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    h+='<div style="display:flex;gap:2px;flex-wrap:wrap;align-items:center">';
    h+='<span style="font-size:10px;color:var(--text-light);font-weight:500;margin-right:2px">'+viewYear+':</span>';
    months.forEach((m,i)=>{
      const mm=String(i+1).padStart(2,'0');
      const ym=viewYear+'-'+mm;
      const cnt=smFilledDates().filter(d=>d.startsWith(ym)).length;
      if(cnt>0){
        h+='<button class="btn btn-default" style="font-size:9px;padding:2px 6px" onclick="monthlySummary(\''+ym+'\')">'+m+' ('+cnt+')</button>';
      } else {
        h+='<span style="font-size:9px;padding:2px 6px;color:var(--text-light);opacity:.3">'+m+'</span>';
      }
    });
    h+='</div></div>';
  }

  // ── FREE-WRITE / DAILY REFLECTION ──
  // From "I'm begging you to start writing" — free writing rewires the mind.
  // Sit, let it flow, no rules. Stored per day under entry._freewrite.
  const fwHidden=localStorage.getItem('sm-hide-fw')==='1';
  const fwText=(state.diary.entries[td]||{})._freewrite||'';
  
  if(fwHidden){
    h+=`<div style="margin-bottom:10px"><button style="background:none;border:none;cursor:pointer;font-size:10px;color:var(--text-light);font-family:var(--font);opacity:.55;padding:0" onclick="localStorage.removeItem('sm-hide-fw');render()">+ Show free-write</button></div>`;
  } else {
    h+=`<div class="card" style="padding:18px 20px;margin-bottom:14px;background:linear-gradient(135deg,rgba(91,141,239,.04),rgba(155,138,222,.06));border:1px solid var(--border)">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
        <div style="font-size:13px;font-weight:700">Free-write</div>
        <span style="font-size:10px;color:var(--text-light);font-style:italic;flex:1">whatever's on your mind, no filter, no rules · 5 minutes</span>
        <button style="background:none;border:none;cursor:pointer;font-size:9px;color:var(--text-light);font-family:var(--font);opacity:.5" onclick="localStorage.setItem('sm-hide-fw','1');render()">hide</button>
      </div>
      <textarea id="sm-freewrite" placeholder="Sit, write, let it flow. Quantity over quality. Make stuff up if nothing comes. The act itself does the work..." onblur="smSaveField('${td}','_freewrite','text',this.value)" style="width:100%;min-height:72px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--card);font-size:12.5px;line-height:1.55;font-family:var(--font);resize:vertical;color:var(--text)">${esc(fwText)}</textarea>
    </div>`;
  }
  
  // ── BIG MULTI-LINE TREND CHART ──
  const showTrends=!localStorage.getItem('sm-hide-trends');
  // Per-pillar visibility (toggleable via legend)
  if(!state.diary.pillarVis) state.diary.pillarVis={};
  
  h+='<div style="margin-bottom:14px">';
  h+='<div style="display:flex;align-items:center;gap:6px;margin-bottom:10px"><button style="background:none;border:none;cursor:pointer;font-size:13px;font-weight:600;font-family:var(--font);color:var(--text);padding:0;display:flex;align-items:center;gap:6px" onclick="localStorage.getItem(\'sm-hide-trends\')?localStorage.removeItem(\'sm-hide-trends\'):localStorage.setItem(\'sm-hide-trends\',\'1\');render()"><span style="font-size:10px;color:var(--text-light);transform:rotate('+(showTrends?'0':'-90')+'deg);transition:transform .15s">\u25BE</span>Score Trends</button><span style="font-size:10px;color:var(--text-light);margin-left:auto">'+filled.length+' entries</span></div>';
  
  if(showTrends && filled.length>0){
    // Range filter (persisted)
    const range=state.diary.trendRange||'90d';
    const allSorted=[...filled].sort();
    const todayD=new Date(); todayD.setHours(0,0,0,0);
    let cutoff=null;
    if(range==='30d'){cutoff=new Date(todayD);cutoff.setDate(cutoff.getDate()-30);}
    else if(range==='90d'){cutoff=new Date(todayD);cutoff.setDate(cutoff.getDate()-90);}
    else if(range==='1y'){cutoff=new Date(todayD);cutoff.setFullYear(cutoff.getFullYear()-1);}
    const sortedDates = cutoff ? allSorted.filter(d=>new Date(d+'T12:00:00')>=cutoff) : allSorted;
    
    // Range buttons
    h+='<div style="display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap;align-items:center">';
    h+='<span style="font-size:10px;color:var(--text-light);font-weight:500;margin-right:4px">Range:</span>';
    [['30d','30 days'],['90d','90 days'],['1y','1 year'],['all','All time']].forEach(([k,l])=>{
      const active=range===k;
      h+='<button onclick="state.diary.trendRange=\''+k+'\';saveState();render()" style="padding:3px 10px;border-radius:12px;border:1px solid '+(active?'var(--accent)':'var(--border-vis)')+';background:'+(active?'var(--accent)':'var(--card)')+';color:'+(active?'#fff':'var(--text-mid)')+';font-size:10px;cursor:pointer;font-family:var(--font);font-weight:'+(active?'600':'400')+'">'+l+'</button>';
    });
    h+='<span style="font-size:10px;color:var(--text-light);margin-left:auto">'+sortedDates.length+' data points</span>';
    h+='</div>';
    
    if(sortedDates.length===0){
      h+='<div class="card" style="padding:30px;text-align:center;color:var(--text-light);font-size:12px">No entries in this range. Try a wider range.</div></div>';
      return h;
    }
    
    // Build dataset using equal x-spacing (one tick per entry date)
    const pillars=getSmPillars();
    const datasets=pillars.map(p=>{
      const points=sortedDates.map((d,i)=>{
        const e=state.diary.entries[d]||{};
        const scores=p.areas.map(a=>{const _n=typeof a==='object'?a.name:a;return e[_n]&&e[_n].score?e[_n].score:0;}).filter(s=>s>0);
        return scores.length?{date:d,score:scores.reduce((a,b)=>a+b,0)/scores.length,xIdx:i}:null;
      }).filter(Boolean);
      return {pillar:p, points};
    });
    
    // SVG dimensions
    const cw=900, ch=380, padL=44, padR=20, padT=20, padB=68;
    const plotW=cw-padL-padR, plotH=ch-padT-padB;
    // Equal spacing: position by index, not by date
    const xFor=idx=>sortedDates.length<=1 ? padL+plotW/2 : padL+(idx/(sortedDates.length-1))*plotW;
    const yFor=s=>padT+(1-s/10)*plotH;
    
    const showLine=!localStorage.getItem('sm-hide-line');
    h+='<div class="card" style="padding:18px;margin-bottom:8px">';
    h+='<div style="display:flex;align-items:center;gap:6px;margin-bottom:'+(showLine?'12':'0')+'px"><button style="background:none;border:none;cursor:pointer;font-size:11px;font-weight:600;font-family:var(--font);color:var(--text-mid);padding:0;display:flex;align-items:center;gap:6px" onclick="localStorage.getItem(\'sm-hide-line\')?localStorage.removeItem(\'sm-hide-line\'):localStorage.setItem(\'sm-hide-line\',\'1\');render()"><span style="font-size:9px;color:var(--text-light);transform:rotate('+(showLine?'0':'-90')+'deg);transition:transform .15s">\u25BE</span>Pillar score lines</button></div>';
    if(showLine){
    h+='<svg viewBox="0 0 '+cw+' '+ch+'" style="width:100%;height:auto;display:block;font-family:var(--font)">';
    
    // Y axis gridlines (0,2,4,6,8,10)
    for(let i=0;i<=10;i+=2){
      const y=yFor(i);
      h+='<line x1="'+padL+'" y1="'+y+'" x2="'+(cw-padR)+'" y2="'+y+'" stroke="var(--border)" stroke-width="1" '+(i===0?'':'stroke-dasharray="2,3"')+'/>';
      h+='<text x="'+(padL-8)+'" y="'+(y+3)+'" text-anchor="end" font-size="10" fill="var(--text-light)">'+i+'</text>';
    }
    h+='<text x="14" y="'+(padT+plotH/2)+'" text-anchor="middle" font-size="10" fill="var(--text-mid)" transform="rotate(-90 14 '+(padT+plotH/2)+')" font-weight="600">Score</text>';
    
    // X axis date ticks - max 8, equally spaced over data, rotated to avoid overlap
    const tickCount=Math.min(sortedDates.length,8);
    for(let i=0;i<tickCount;i++){
      const idx=Math.round(i*(sortedDates.length-1)/Math.max(tickCount-1,1));
      const d=sortedDates[idx];
      const x=xFor(idx);
      h+='<line x1="'+x+'" y1="'+(padT+plotH)+'" x2="'+x+'" y2="'+(padT+plotH+4)+'" stroke="var(--text-light)" stroke-width="1"/>';
      const label=new Date(d+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'2-digit'});
      h+='<text x="'+x+'" y="'+(padT+plotH+16)+'" text-anchor="end" font-size="10" fill="var(--text-mid)" transform="rotate(-35 '+x+' '+(padT+plotH+16)+')">'+label+'</text>';
    }
    
    // Draw each pillar line
    datasets.forEach(({pillar,points})=>{
      const visible=state.diary.pillarVis[pillar.name]!==false;
      if(!visible||points.length===0) return;
      
      let d='';
      points.forEach((p,i)=>{
        d+=(i===0?'M':' L')+xFor(p.xIdx)+','+yFor(p.score);
      });
      h+='<path d="'+d+'" fill="none" stroke="'+pillar.color+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" opacity="0.9"/>';
      points.forEach(p=>{
        h+='<circle cx="'+xFor(p.xIdx)+'" cy="'+yFor(p.score)+'" r="3.5" fill="'+pillar.color+'" stroke="var(--card)" stroke-width="1.5"><title>'+pillar.name+' - '+new Date(p.date+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})+': '+p.score.toFixed(1)+'/10</title></circle>';
      });
    });
    
    h+='</svg>';
    
    // Legend (clickable to toggle)
    h+='<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;justify-content:center">';
    datasets.forEach(({pillar,points})=>{
      const visible=state.diary.pillarVis[pillar.name]!==false;
      const avg=points.length?(points.reduce((s,p)=>s+p.score,0)/points.length).toFixed(1):'-';
      h+='<button onclick="state.diary.pillarVis[\''+esc(pillar.name)+'\']='+(visible?'false':'true')+';saveState();render()" style="display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;border:1px solid '+(visible?pillar.color:'var(--border)')+';background:'+(visible?pillar.color+'15':'transparent')+';cursor:pointer;font-family:var(--font);font-size:11px;font-weight:600;color:'+(visible?pillar.color:'var(--text-light)')+';opacity:'+(visible?'1':'.45')+';transition:all .15s">';
      h+='<span style="width:14px;height:3px;border-radius:2px;background:'+pillar.color+';display:inline-block"></span>';
      h+=esc(pillar.name)+' <span style="font-weight:400;opacity:.7;font-size:10px">('+avg+')</span>';
      h+='</button>';
    });
    h+='</div>';
    h+='<div style="font-size:10px;color:var(--text-light);text-align:center;margin-top:6px;font-style:italic">Click a pillar to hide/show it</div>';
    } // end if(showLine)
    h+='</div>';
    
    // ── Self Map fill-rate timeline — respects the range selector ──
    const fillDayCount = range==='30d'?30 : range==='90d'?90 : range==='1y'?365 : Math.max(60, sortedDates.length>0?Math.ceil((todayD-new Date(sortedDates[0]+'T12:00:00'))/86400000)+1:60);
    const filledSet=new Set(filled);
    const todayBase=new Date(); todayBase.setHours(0,0,0,0);
    const fillDays=[];
    for(let i=fillDayCount-1;i>=0;i--){
      const d=new Date(todayBase);
      d.setDate(d.getDate()-i);
      fillDays.push(d.toISOString().slice(0,10));
    }
    const fillCount=fillDays.filter(d=>filledSet.has(d)).length;
    const fillPct=fillDayCount>0?Math.round(fillCount/fillDayCount*100):0;
    
    // SVG dims
    const fcw=900, fch=120, fpadT=24, fpadB=28, barH=fch-fpadT-fpadB;
    const fbarW=fcw/fillDayCount;
    
    const showFill=!localStorage.getItem('sm-hide-fill');
    h+='<div class="card" style="padding:16px;margin-bottom:14px">';
    h+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:'+(showFill?'12':'0')+'px">';
    h+='<button style="background:none;border:none;cursor:pointer;padding:0;display:flex;align-items:center;gap:6px;font-family:var(--font)" onclick="localStorage.getItem(\'sm-hide-fill\')?localStorage.removeItem(\'sm-hide-fill\'):localStorage.setItem(\'sm-hide-fill\',\'1\');render()"><span style="font-size:9px;color:var(--text-light);transform:rotate('+(showFill?'0':'-90')+'deg);transition:transform .15s">\u25BE</span><span style="font-size:13px;font-weight:700;color:var(--text)">Self Map filled</span></button>';
    h+='<span style="font-size:11px;color:var(--text-mid);font-weight:600">'+fillCount+'/'+fillDayCount+' days <span style="color:var(--text-light);font-weight:400">('+fillPct+'%)</span></span>';
    if(showFill) h+='<span style="font-size:10px;color:var(--text-light);margin-left:auto">last '+fillDayCount+' days · today on the right</span>';
    h+='</div>';
    if(showFill){
    h+='<svg viewBox="0 0 '+fcw+' '+fch+'" style="width:100%;height:auto;display:block;font-family:var(--font)" preserveAspectRatio="none">';
    
    // Month labels
    let lastM=-1;
    fillDays.forEach((d,i)=>{
      const dateObj=new Date(d+'T12:00:00');
      const m=dateObj.getMonth();
      const isFirstOfMonth=dateObj.getDate()===1;
      const showLabel = m!==lastM || isFirstOfMonth;
      if(showLabel && i!==fillDays.length-1){
        const label=dateObj.toLocaleDateString('en-GB',{month:'short'})+ (m===0?' \u2018'+String(dateObj.getFullYear()).slice(-2):'');
        h+='<text x="'+(i*fbarW+2)+'" y="14" font-size="10" fill="var(--text-light)" font-weight="600">'+label+'</text>';
        h+='<line x1="'+(i*fbarW)+'" y1="'+fpadT+'" x2="'+(i*fbarW)+'" y2="'+(fpadT+barH)+'" stroke="var(--border)" stroke-width="1" stroke-dasharray="2,2"/>';
        lastM=m;
      }
    });
    
    // Bars
    fillDays.forEach((d,i)=>{
      const isFilled=filledSet.has(d);
      const dateObj=new Date(d+'T12:00:00');
      const isToday=d===todayISO();
      const isWeekend=dateObj.getDay()===0||dateObj.getDay()===6;
      const fill=isFilled?'#5A9E7E':'var(--border)';
      const op=isFilled?(isWeekend?0.65:0.95):(isWeekend?0.35:0.55);
      h+='<rect x="'+(i*fbarW+0.5)+'" y="'+fpadT+'" width="'+Math.max(fbarW-1,1)+'" height="'+barH+'" ';
      h+='fill="'+fill+'" opacity="'+op+'"';
      if(isToday) h+=' stroke="var(--accent)" stroke-width="2"';
      h+='><title>'+dateObj.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'})+(isFilled?' \u2014 filled':' \u2014 skipped')+'</title></rect>';
    });
    
    // Bottom edge labels
    h+='<text x="0" y="'+(fch-6)+'" font-size="10" fill="var(--text-light)">'+new Date(fillDays[0]+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'})+'</text>';
    h+='<text x="'+fcw+'" y="'+(fch-6)+'" font-size="10" fill="var(--text-light)" text-anchor="end">today</text>';
    
    // Legend
    h+='<g transform="translate('+(fcw/2-100)+' '+(fch-12)+')">';
    h+='<rect x="0" y="-8" width="10" height="10" fill="#5A9E7E" rx="1"/>';
    h+='<text x="14" y="1" font-size="10" fill="var(--text-mid)">filled</text>';
    h+='<rect x="60" y="-8" width="10" height="10" fill="var(--border)" opacity="0.55" rx="1"/>';
    h+='<text x="74" y="1" font-size="10" fill="var(--text-mid)">skipped</text>';
    h+='<rect x="130" y="-8" width="10" height="10" fill="#5A9E7E" opacity="0.65" rx="1"/>';
    h+='<text x="144" y="1" font-size="10" fill="var(--text-mid)">weekend</text>';
    h+='</g>';
    
    h+='</svg>';
    } // end if(showFill)
    h+='</div>';
  }
  h+='</div>';

  SM_PILLARS.forEach((pillar,pi)=>{
    const pavg=pillarAvg[pillar.name]||0;
    const pcKey='sm-p-'+pi;
    // Default: collapsed unless explicitly opened, OR pillar has content today
    const hasTodayContent=pillar.areas.some(a=>{const n=typeof a==='object'?a.name:a;const ae=entry[n];return ae&&(ae.score||ae.repeat||ae.improve||ae.action);});
    const userOpened=state.diary[pcKey]==='open';
    const userClosed=state.diary[pcKey]==='closed';
    const pCollapsed = userOpened ? false : userClosed ? true : !hasTodayContent;
    const trend=smPillarTrendChart(pillar.name);

    h+=`<div class="sm-pillar" style="animation:smSlideUp .3s ease-out both;animation-delay:${pi*50}ms">
      <div class="sm-pillar-head" onclick="state.diary['${pcKey}']=(${pCollapsed?'true':'false'})?'open':'closed';saveState();render()" style="background:linear-gradient(135deg,${pillar.color}20,${pillar.color}08)">
        <div style="width:4px;height:28px;border-radius:2px;background:${pillar.color};flex-shrink:0"></div>
        <div style="flex:1">
          <div style="font-size:13px;font-weight:700">${pillar.name}</div>
          ${trend?`<div style="margin-top:3px">${trend}</div>`:''}
        </div>
        ${pavg?`<div style="text-align:center;min-width:36px"><div style="font-size:18px;font-weight:800;color:${pillar.color};line-height:1">${pavg}</div><div style="font-size:7px;color:var(--text-light)">avg</div></div>`:''}
        <span style="font-size:10px;color:var(--text-light);transform:rotate(${pCollapsed?'-90deg':'0'});transition:transform .15s">\u25BE</span>
      </div>`;

    if(!pCollapsed){
      pillar.areas.forEach((areaObj,ai)=>{
        const area=typeof areaObj==='object'?areaObj.name:areaObj;
        const ae=entry[area]||{repeat:"",improve:"",action:"",score:0};
        const areaDef=smAreaDef(area);
        const hasContent=ae.score||ae.repeat||ae.improve||ae.action;
        const aKey='sm-a-'+pi+'-'+ai;
        const userOpenA=state.diary[aKey]==='open';
        const userClosedA=state.diary[aKey]==='closed';
        const aCollapsed = userOpenA ? false : userClosedA ? true : !hasContent;
        
        // Walk back through prior days chronologically; skip days that have no entry FOR THIS AREA.
        // Show the most recent prior day where this specific area was actually filled.
        const filledBefore=smFilledDates().filter(d=>d<td).sort();
        let prevDate=null, prevEntry=null;
        for(let i=filledBefore.length-1;i>=0;i--){
          const candidate=filledBefore[i];
          const candEntry=(state.diary.entries[candidate]||{})[area];
          if(candEntry&&(candEntry.repeat||candEntry.improve||candEntry.action||candEntry.score)){
            prevDate=candidate;
            prevEntry=candEntry;
            break;
          }
        }
        const prevHasContent=!!prevEntry;
        const prevDateLabel=prevDate?new Date(prevDate+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'2-digit'}):'';
        const scoreCol=ae.score?(ae.score<=3?'#CF6F6F':ae.score<=6?'#D4A04A':'#5A9E7E'):'var(--text-light)';
        
        if(aCollapsed){
          // Single-line collapsed stub
          h+=`<div onclick="state.diary['${aKey}']='open';saveState();render()" style="display:flex;align-items:center;gap:10px;padding:9px 18px;border-top:1px solid var(--border);cursor:pointer;transition:background .1s" onmouseover="this.style.background='var(--accent-soft)'" onmouseout="this.style.background=''">
            <span style="font-size:12px;font-weight:500;flex:1;color:var(--text-mid)">${esc(area)}</span>
            ${ae.score?`<span style="font-size:10px;color:var(--text-light)">last: ${prevHasContent&&prevEntry.score?prevEntry.score+'/10':'\u2014'}</span>`:''}
            <span style="font-size:11px;font-weight:700;color:${scoreCol};min-width:34px;text-align:right">${ae.score?ae.score+'/10':'\u2014'}</span>
            <span style="font-size:9px;color:var(--text-light)">\u203A</span>
          </div>`;
        } else {
          h+=`<div class="sm-area" style="animation-delay:${ai*30}ms">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px;flex-wrap:wrap">
              <div style="display:flex;flex-direction:column;flex:1;min-width:200px">
                <div style="display:flex;align-items:center;gap:8px">
                  <span onclick="state.diary['${aKey}']='closed';saveState();render()" style="cursor:pointer;font-size:9px;color:var(--text-light)" title="Collapse">\u25BE</span>
                  <span style="font-size:12.5px;font-weight:600">${esc(area)}</span>
                  ${areaDef.adhered?`<button onclick="event.stopPropagation();showAdherence('${esc(area)}')" style="font-size:9px;padding:2px 6px;border-radius:4px;border:1px solid var(--border);background:rgba(90,158,126,.08);color:#5A9E7E;cursor:pointer;font-family:var(--font)">guide</button>`:''}
                </div>
                ${areaDef.question?`<span style="font-size:10.5px;color:var(--text-light);font-style:italic;margin-top:2px">${esc(areaDef.question)}</span>`:''}
              </div>
              <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;min-width:240px">

// AI COACH — Local Analysis Engine (no API needed)
if(!state.coachHistory) state.coachHistory=[];

function coachAnalyze(type){
  const s=getStats();
  const filled=smFilledDates();
  const td=todayISO();
  const thisWeek=filled.filter(d=>{const diff=(new Date(td)-new Date(d))/864e5;return diff>=0&&diff<7;});
  let streak=0;const d=new Date();
  for(let i=0;i<365;i++){const ds=d.toISOString().slice(0,10);if(filled.includes(ds))streak++;else if(i>0)break;d.setDate(d.getDate()-1);}
  
  // Compute per-area averages
  const areaAvg={};
  SM_ALL_AREAS.forEach(area=>{
    const scores=[];
    filled.forEach(d=>{const e=state.diary.entries[d];if(e&&e[area]&&e[area].score)scores.push(e[area].score);});
    areaAvg[area]=scores.length?(scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(1):'-';
  });
  
  const overdue=state.actions.filter(a=>isOverdue(a.due,a.status));
  const todayFocus=state.actions.filter(a=>a.todayFocus&&a.status!=='Done');
  
  // 7 Habits mapping
  const habits7={
    'Be Proactive':['Proactivity','Process Commitment','Impulse Control'],
    'Begin with End in Mind':['Planning & Productivity','Self Map'],
    'Put First Things First':['Focus/Attention','Planning & Productivity'],
    'Think Win-Win':['Communication','Wife','Family','Friends'],
    'Seek to Understand':['Communication','Emotional Stability'],
    'Synergize':['Wife','Family','Friends','Communication'],
    'Sharpen the Saw':['Prayer','Weightlifting','Cardio','Intermittent Fasting','Notes & Reading']
  };
  
  let msg='';
  
  if(type==='focus'){
    msg='<b>Today\'s Focus Analysis</b>\n\n';
    if(todayFocus.length) msg+='Your focus items:\n'+todayFocus.slice(0,5).map(a=>'  '+a.action.slice(0,50)+' ('+a.owner+')').join('\n');
    else msg+='No items marked as Today Focus. Go to Actions, star a few priorities.';
    msg+='\n\n';
    if(overdue.length) msg+='<b style="color:var(--danger)">'+overdue.length+' overdue</b> — consider: close what\'s stale, reschedule what\'s real, delegate what\'s not yours.';
    msg+='\n\nHabit 3 reminder: Put First Things First. Ask: \"What is the ONE thing that, if done today, makes everything else easier?\"';
  }
  
  else if(type==='selfmap'){
    msg='<b>Self Map Pattern Analysis</b> ('+filled.length+' entries)\n\n';
    // Find weakest and strongest areas
    const ranked=SM_ALL_AREAS.filter(a=>areaAvg[a]!=='-').sort((a,b)=>parseFloat(areaAvg[a])-parseFloat(areaAvg[b]));
    if(ranked.length>=4){
      msg+='<b>Weakest areas:</b>\n';
      ranked.slice(0,3).forEach(a=>msg+='  '+a+': '+areaAvg[a]+'/10\n');
      msg+='\n<b>Strongest areas:</b>\n';
      ranked.slice(-3).reverse().forEach(a=>msg+='  '+a+': '+areaAvg[a]+'/10\n');
    }
    msg+='\n<b>Streak:</b> '+streak+' days (record: 34)\nSelf Map entries this week: '+thisWeek.length+'/7';
    msg+='\n\nHabit 7 — Sharpen the Saw: Balance across Physical (exercise), Spiritual (prayer), Mental (learning), Social (relationships). Your data shows where the imbalance is.';
  }
  
  else if(type==='overdue'){
    msg='<b>Overdue Review</b> — '+overdue.length+' items\n\n';
    if(!overdue.length){msg+='Clean slate. Nothing overdue.';return msg;}
    const byProj={};overdue.forEach(a=>{if(!byProj[a.project])byProj[a.project]=[];byProj[a.project].push(a);});
    Object.entries(byProj).forEach(([p,items])=>{
      msg+='<b>'+p+'</b> ('+items.length+'):\n';
      items.slice(0,4).forEach(a=>msg+='  '+a.action.slice(0,45)+' — '+a.owner+(a.due?' (due '+a.due+')':'')+' \n');
      if(items.length>4) msg+='  ...+'+(items.length-4)+' more\n';
      msg+='\n';
    });
    msg+='Ask for each: Is this still relevant? Can someone else own it? What\'s the real next physical action?';
  }
  
  else if(type==='patterns'){
    msg='<b>Recurring Patterns</b> (from '+filled.length+' entries)\n\n';
    // Search for common themes
    const themes={};
    ['anger','phone','prayer','focus','wife','planning','morning','sleep','gym','fasting','discipline','consistency'].forEach(term=>{
      const matches=smSearch(term);
      if(matches.length>=3) themes[term]=matches.length;
    });
    if(Object.keys(themes).length){
      msg+='Themes that appear 3+ times in your journal:\n';
      Object.entries(themes).sort((a,b)=>b[1]-a[1]).forEach(([t,n])=>{msg+='  "'+t+'" — '+n+' entries\n';});
      msg+='\nThese are your loops. Habit 1 — Be Proactive: You can\'t control the stimulus, but you own the response.';
    } else {
      msg+='Not enough journal text to detect patterns. Keep writing in the Repeat/Improve/Action fields.';
    }
  }
  
  else if(type==='7habits'){
    msg='<b>7 Habits Assessment</b>\n\n';
    Object.entries(habits7).forEach(([habit,areas])=>{
      const scores=areas.map(a=>parseFloat(areaAvg[a])||0).filter(s=>s>0);
      const avg=scores.length?(scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(1):'-';
      const bar=avg!=='-'?'\u2588'.repeat(Math.round(parseFloat(avg)))+'\u2591'.repeat(10-Math.round(parseFloat(avg))):'\u2591'.repeat(10);
      msg+='<b>'+habit+'</b> '+avg+'/10 '+bar+'\n';
      msg+='  Areas: '+areas.join(', ')+'\n\n';
    });
    msg+='Habits 1-3 are about <b>Private Victory</b> (independence).\nHabits 4-6 are about <b>Public Victory</b> (interdependence).\nHabit 7 is <b>Renewal</b> — the foundation for everything else.';
  }
  
  else if(type==='honest'){
    msg='<b>Honest Assessment</b>\n\n';
    const pct=s.total?Math.round(s.done/s.total*100):0;
    msg+='Actions: '+s.done+'/'+s.total+' done ('+pct+'%). ';
    if(pct<15) msg+='That\'s very low. Are you capturing actions you never intend to do?';
    else if(pct<40) msg+='Below average. Many open items suggest either overcommitment or avoidance.';
    else msg+='Decent completion rate.';
    msg+='\n\n';
    msg+='Self Map: '+filled.length+' entries across '+Math.round((new Date()-new Date(filled[0]||td))/864e5)+' days. ';
    const fillRate=filled.length?(filled.length/Math.round((new Date()-new Date(filled[0]))/864e5)*100).toFixed(1):0;
    msg+='Fill rate: '+fillRate+'%.\n';
    if(streak===0) msg+='\nCurrent streak: 0 days. You\'re not using the Self Map right now.';
    else if(streak<3) msg+='\nStreak: '+streak+' days. Fragile. The 2-day rule: never miss two days in a row.';
    else msg+='\nStreak: '+streak+' days. Building momentum. Don\'t break it.';
    msg+='\n\nHabit 2 — Begin with the End in Mind: What does your ideal week actually look like? If you can\'t describe it, you can\'t build it.';
  }
  
  return msg;
}


// Generate prompt for Claude chat
function generatePrompt(type){
  const s=getStats();
  const filled=smFilledDates();
  const td=todayISO();
  const overdue=state.actions.filter(a=>isOverdue(a.due,a.status));
  const todayFocus=state.actions.filter(a=>a.todayFocus&&a.status!=='Done');
  
  // Compute area averages
  const areaAvg={};
  SM_ALL_AREAS.forEach(area=>{
    const scores=[];
    filled.forEach(d=>{const e=state.diary.entries[d];if(e&&e[area]&&e[area].score)scores.push(e[area].score);});
    areaAvg[area]=scores.length?(scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(1):'-';
  });
  
  // 7 Habits scores
  const habits7=[
    {habit:'Be Proactive',areas:['Effort','Consistency','Self respect (delayed gratification)']},
    {habit:'Begin with End in Mind',areas:['Planning & Productivity','Self Map']},
    {habit:'Put First Things First',areas:['Focus/Attention','Planning & Productivity']},
    {habit:'Think Win-Win',areas:['Communication','Wife','Family','Friends']},
    {habit:'Seek to Understand',areas:['Communication','Emotional Stability/Stoicism']},
    {habit:'Synergize',areas:['Wife','Family','Friends','Communication']},
    {habit:'Sharpen the Saw',areas:['Prayer','Weightlifting','Cardio','Intermittent fasting','Learning how to learn']}
  ];
  
  let prompt='I use a personal development app with an Action Tracker and a Self Map journal. Here is my data:\n\n';
  
  prompt+='ACTION TRACKER: '+s.total+' actions, '+s.done+' done ('+Math.round(s.done/Math.max(s.total,1)*100)+'%), '+overdue.length+' overdue, '+s.prio+' priority\n';
  prompt+='Projects: '+getProjects().join(', ')+'\n\n';
  
  prompt+='SELF MAP: '+filled.length+' diary entries from '+(filled[0]||'none')+' to '+(filled[filled.length-1]||'none')+'\n';
  prompt+='Area averages (from all entries):\n';
  SM_PILLARS.forEach(p=>{
    prompt+=p.name+': ';
    p.areas.forEach(a=>prompt+=a+'='+areaAvg[a]+' ');
    prompt+='\n';
  });
  
  prompt+='\n7 HABITS SCORES:\n';
  habits7.forEach(hb=>{
    const scores=hb.areas.map(a=>parseFloat(areaAvg[a])||0).filter(x=>x>0);
    const avg=scores.length?(scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(1):'-';
    prompt+=hb.habit+': '+avg+'/10\n';
  });
  
  if(type==='focus'){
    prompt+='\nTODAY FOCUS: ';
    if(todayFocus.length) prompt+=todayFocus.map(a=>a.action.slice(0,50)+' ('+a.owner+')').join('; ');
    else prompt+='No items marked as today focus.';
    prompt+='\nOverdue: '+overdue.slice(0,8).map(a=>a.action.slice(0,40)+' ('+a.owner+', due '+a.due+')').join('; ');
    prompt+='\n\nBased on this data, what should I focus on today? Reference the 7 Habits. Be direct and specific.';
  }
  else if(type==='selfmap'){
    // Add latest entry
    const latest=filled[filled.length-1];
    if(latest){
      const e=state.diary.entries[latest];
      prompt+='\nLATEST ENTRY ('+latest+'):\n';
      SM_ALL_AREAS.forEach(a=>{const ae=e[a];if(ae&&(ae.score||ae.repeat||ae.improve||ae.action)){
        prompt+=a+': score='+ae.score;
        if(ae.repeat) prompt+=' | repeat: '+ae.repeat.slice(0,60);
        if(ae.improve) prompt+=' | improve: '+ae.improve.slice(0,60);
        if(ae.action) prompt+=' | action: '+ae.action.slice(0,60);
        prompt+='\n';
      }});
    }
    prompt+='\nAnalyze my Self Map patterns. What areas am I consistently weak in? What is improving? Map to the 7 Habits framework and give me 3 specific actions.';
  }
  else if(type==='overdue'){
    prompt+='\nOVERDUE ACTIONS ('+overdue.length+'):\n';
    overdue.slice(0,15).forEach(a=>prompt+=a.action.slice(0,50)+' | '+a.owner+' | due: '+a.due+' | project: '+a.project+'\n');
    prompt+='\nReview these overdue items. For each: should I close it, delegate it, reschedule it, or do it today? Be ruthless. Reference Habit 3 (Put First Things First).';
  }
  else if(type==='patterns'){
    prompt+='\nRECURRING THEMES FROM JOURNAL:\n';
    ['anger','phone','prayer','focus','wife','planning','morning','discipline','consistency','sleep','gym'].forEach(term=>{
      const matches=smSearch(term);
      if(matches.length>=2) prompt+='"'+term+'": appears in '+matches.length+' entries\n';
    });
    prompt+='\nWhat patterns do you see? What are my deepest recurring struggles? How do I break these loops using the 7 Habits? Be brutally honest.';
  }
  else if(type==='7habits'){
    prompt+='\nGive me a thorough 7 Habits assessment based on my data above. For each habit, tell me: what I am doing well, where I am failing, and one concrete next action. End with which habit I should focus on this week and why.';
  }
  else if(type==='honest'){
    prompt+='\nGive me a brutally honest productivity assessment. Am I making real progress or just building systems and planning? What does my data actually show about my behavior vs my intentions? Don\'t be nice. Reference specific numbers.';
  }
  
  return prompt;
}

function copyPrompt(type){
  const prompt=generatePrompt(type);
  navigator.clipboard.writeText(prompt).then(()=>{
    toast('Copied to clipboard — paste into Claude chat');
  }).catch(()=>{
    // Fallback
    const ta=document.createElement('textarea');
    ta.value=prompt;document.body.appendChild(ta);
    ta.select();document.execCommand('copy');
    document.body.removeChild(ta);
    toast('Copied to clipboard');
  });
}

// ═══ YEARLY SUMMARY ANALYSIS ═══
function yearlySummary(year){
  const filled=smFilledDates().filter(d=>d.startsWith(String(year)));
  if(!filled.length){toast('No entries for '+year);return;}
  
  // Compute per-area averages for this year
  const areaAvg={};const areaTexts={};
  SM_ALL_AREAS.forEach(area=>{
    const scores=[];const repeats=[];const improves=[];const actions=[];
    filled.forEach(d=>{
      const e=state.diary.entries[d];if(!e||!e[area])return;
      if(e[area].score) scores.push(e[area].score);
      if(e[area].repeat) repeats.push(e[area].repeat);
      if(e[area].improve) improves.push(e[area].improve);
      if(e[area].action) actions.push(e[area].action);
    });
    areaAvg[area]=scores.length?(scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(1):'-';
    areaTexts[area]={repeats,improves,actions,count:scores.length};
  });
  
  // Pillar averages
  const pillarAvg={};
  SM_PILLARS.forEach(p=>{
    const scores=p.areas.map(a=>parseFloat(areaAvg[a])||0).filter(s=>s>0);
    pillarAvg[p.name]=scores.length?(scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(1):'-';
  });
  
  // 7 Habits scores for this year
  const habits7=[
    {habit:'1. Be Proactive',areas:['Effort','Consistency','Self respect (delayed gratification)']},
    {habit:'2. End in Mind',areas:['Planning & Productivity','Self Map']},
    {habit:'3. First Things First',areas:['Focus/Attention','Planning & Productivity']},
    {habit:'4. Win-Win',areas:['Communication','Wife','Family','Friends']},
    {habit:'5. Understand First',areas:['Communication','Emotional Stability/Stoicism']},
    {habit:'6. Synergize',areas:['Wife','Family','Friends','Communication']},
    {habit:'7. Sharpen the Saw',areas:['Prayer','Weightlifting','Cardio','Intermittent fasting','Learning how to learn']}
  ];
  
  // Find recurring themes from text
  const allText=filled.map(d=>{const e=state.diary.entries[d];return SM_ALL_AREAS.map(a=>e[a]?[e[a].repeat,e[a].improve,e[a].action].join(' '):'').join(' ');}).join(' ').toLowerCase();
  const themes={};
  ['anger','phone','prayer','focus','wife','planning','morning','discipline','consistency','sleep','gym','fasting','effort','lazy','procrastinat','afraid','anxiety','stress','grateful','happy','strong','weak','fail','succeed','improve','struggle'].forEach(term=>{
    const count=(allText.match(new RegExp(term,'g'))||[]).length;
    if(count>=2) themes[term]=count;
  });
  
  // Strongest and weakest
  const ranked=SM_ALL_AREAS.filter(a=>areaAvg[a]!=='-').sort((a,b)=>parseFloat(areaAvg[a])-parseFloat(areaAvg[b]));
  
  // Build modal
  const m=document.createElement('div');m.className='modal-overlay';m.onclick=e=>{if(e.target===m)m.remove();};
  
  let body=`<div class="modal" style="max-width:600px;max-height:90vh;overflow:auto">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px">
      <div>
        <h2 style="font-size:20px;font-weight:700">${year} Year in Review</h2>
        <p style="font-size:12px;color:var(--text-mid);margin-top:2px">${filled.length} entries</p>
      </div>
      <button class="btn btn-ghost" style="font-size:14px" onclick="this.closest('.modal-overlay').remove()">\u2715</button>
    </div>
    
    <div style="font-size:12px;font-weight:600;margin-bottom:8px">Pillar Scores</div>
    <div style="display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap">`;
  SM_PILLARS.forEach(p=>{
    const avg=pillarAvg[p.name];
    body+=`<div style="flex:1;min-width:100px;padding:10px;border-radius:var(--radius-xs);background:${p.color}08;border:1px solid ${p.color}15;text-align:center">
      <div style="font-size:20px;font-weight:700;color:${p.color}">${avg}</div>
      <div style="font-size:9px;color:var(--text-mid);margin-top:2px">${p.name.split('/')[0]}</div>
    </div>`;
  });
  body+=`</div>`;
  
  // Strongest & Weakest
  if(ranked.length>=4){
    body+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">
      <div><div style="font-size:12px;font-weight:600;color:var(--success);margin-bottom:6px">Strongest Areas</div>`;
    ranked.slice(-3).reverse().forEach(a=>{
      body+=`<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border);font-size:11px"><span>${a}</span><span style="font-weight:600">${areaAvg[a]}</span></div>`;
    });
    body+=`</div><div><div style="font-size:12px;font-weight:600;color:var(--danger);margin-bottom:6px">Weakest Areas</div>`;
    ranked.slice(0,3).forEach(a=>{
      body+=`<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border);font-size:11px"><span>${a}</span><span style="font-weight:600">${areaAvg[a]}</span></div>`;
    });
    body+=`</div></div>`;
  }
  
  // 7 Habits Assessment
  body+=`<div style="font-size:12px;font-weight:600;margin-bottom:8px">7 Habits Assessment</div>
    <div style="margin-bottom:16px">`;
  habits7.forEach(hb=>{
    const scores=hb.areas.map(a=>parseFloat(areaAvg[a])||0).filter(s=>s>0);
    const avg=scores.length?(scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(1):'-';
    const pct=avg!=='-'?parseFloat(avg)*10:0;
    body+=`<div style="display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--border)">
      <span style="font-size:11px;width:160px;flex-shrink:0">${hb.habit}</span>
      <div style="flex:1;height:6px;background:var(--border-vis);border-radius:3px;overflow:hidden"><div style="height:100%;width:${pct}%;background:var(--accent);border-radius:3px"></div></div>
      <span style="font-size:11px;font-weight:600;width:32px;text-align:right">${avg}</span>
    </div>`;
  });
  body+=`</div>`;
  
  // Recurring Themes
  const sortedThemes=Object.entries(themes).sort((a,b)=>b[1]-a[1]);
  if(sortedThemes.length){
    body+=`<div style="font-size:12px;font-weight:600;margin-bottom:8px">Recurring Themes</div>
      <div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px">`;
    sortedThemes.slice(0,12).forEach(([term,count])=>{
      body+=`<span style="font-size:10px;padding:3px 8px;border-radius:12px;background:var(--accent-soft);color:var(--text-mid)">${term} (${count})</span>`;

    body+=`</div>`;
  }
  
  // What went well / What needs improvement (from text analysis)
  body+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">
    <div style="padding:10px;border-radius:var(--radius-xs);background:rgba(48,209,88,.04);border:1px solid rgba(48,209,88,.08)">
      <div style="font-size:11px;font-weight:600;color:var(--success);margin-bottom:6px">What went well</div>
      <div style="font-size:10.5px;color:var(--text-mid);line-height:1.6">`;
  // Pull top repeat entries from strongest areas
  if(ranked.length){
    ranked.slice(-2).reverse().forEach(area=>{
      const reps=areaTexts[area].repeats.slice(-3);
      if(reps.length) body+=`<b>${area}:</b> ${reps.map(r=>r.slice(0,50)).join('; ')}<br>`;
    });
  }
  body+=`</div></div>
    <div style="padding:10px;border-radius:var(--radius-xs);background:rgba(255,69,58,.03);border:1px solid rgba(255,69,58,.06)">
      <div style="font-size:11px;font-weight:600;color:var(--danger);margin-bottom:6px">Needs improvement</div>
      <div style="font-size:10.5px;color:var(--text-mid);line-height:1.6">`;
  if(ranked.length){
    ranked.slice(0,2).forEach(area=>{
      const imps=areaTexts[area].improves.slice(-3);
      if(imps.length) body+=`<b>${area}:</b> ${imps.map(r=>r.slice(0,50)).join('; ')}<br>`;
    });
  }
  body+=`</div></div></div>`;
  
  // Goals planned vs achieved
  const yearActions=state.actions.filter(a=>(a.createdAt||'').startsWith(String(year)));
  const yearDone=state.actions.filter(a=>a.status==='Done'&&(a.createdAt||'').startsWith(String(year)));

function monthlySummary(ym){
  const year=ym.slice(0,4);const monthIdx=parseInt(ym.slice(5,7))-1;

  const filled=smFilledDates().filter(d=>d.startsWith(ym));
  if(!filled.length){toast('No entries for '+monthName);return;}
  
  const areaAvg={};
  SM_ALL_AREAS.forEach(area=>{
    const scores=[];
    filled.forEach(d=>{const e=state.diary.entries[d];if(e&&e[area]&&e[area].score)scores.push(e[area].score);});
    areaAvg[area]=scores.length?(scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(1):'-';

function copyYearlySummary(year){

// FEATURE 1: POMODORO TIMER

let pomodoroState={running:false,seconds:25*60,mode:'work',actionId:null,interval:null,sessions:0};
function pomodoroStart(actionId){
  if(pomodoroState.interval)clearInterval(pomodoroState.interval);
  pomodoroState={running:true,seconds:25*60,mode:'work',actionId:actionId||null,interval:null,sessions:pomodoroState.sessions};
  pomodoroState.interval=setInterval(()=>{
    pomodoroState.seconds--;
    updatePomodoroDisplay();
    if(pomodoroState.seconds<=0){
      clearInterval(pomodoroState.interval);pomodoroState.running=false;
      if(pomodoroState.mode==='work'){
        pomodoroState.sessions++;
        if(pomodoroState.actionId){const a=state.actions.find(x=>x.id===pomodoroState.actionId);if(a){if(!a.pomodoroCount)a.pomodoroCount=0;a.pomodoroCount++;saveState();}}
        try{new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQ==').play();}catch(e){}
        toast('Pomodoro done! Take a break.');
        pomodoroState.mode='break';pomodoroState.seconds=5*60;
      } else {pomodoroState.mode='work';pomodoroState.seconds=25*60;toast('Break over!');}
      render();
    }
  },1000);
  render();
}
function pomodoroStop(){clearInterval(pomodoroState.interval);pomodoroState.running=false;pomodoroState.seconds=25*60;pomodoroState.mode='work';render();}
function updatePomodoroDisplay(){const el=document.getElementById('pomo-display');if(el){const m=Math.floor(pomodoroState.seconds/60);const s=pomodoroState.seconds%60;el.textContent=`${m}:${s<10?'0':''}${s}`;}}
function pomodoroWidget(){
  if(!pomodoroState.running && pomodoroState.seconds===25*60) return '';
  const m=Math.floor(pomodoroState.seconds/60);const s=pomodoroState.seconds%60;
  const pct=pomodoroState.mode==='work'?(1-pomodoroState.seconds/(25*60))*100:(1-pomodoroState.seconds/(5*60))*100;
  const isWork=pomodoroState.mode==='work';
  return `<div style="display:flex;align-items:center;gap:12px;padding:10px 16px;margin-bottom:12px;background:${isWork?'rgba(255,69,58,.04)':'rgba(48,209,88,.04)'};border-radius:var(--radius);border:1px solid ${isWork?'rgba(255,69,58,.08)':'rgba(48,209,88,.08)'}">
    <div style="font-size:18px;font-weight:600;font-family:var(--mono);color:${isWork?'var(--danger)':'var(--success)'};letter-spacing:-.02em" id="pomo-display">${m}:${s<10?'0':''}${s}</div>
    <div style="flex:1"><div style="height:2px;background:var(--border-vis);border-radius:1px;overflow:hidden"><div style="height:100%;background:${isWork?'var(--danger)':'var(--success)'};width:${pct}%;transition:width 1s linear"></div></div>
    <div style="font-size:10px;color:var(--text-light);margin-top:3px;font-weight:400">${isWork?'Focus':'Break'}${pomodoroState.sessions?' · '+pomodoroState.sessions+' done':''}</div></div>
    <button class="btn btn-ghost" style="font-size:11px;padding:4px 10px" onclick="pomodoroStop()">Stop</button>
  </div>`;
}

function startVoiceInput(targetId){
  if(!('webkitSpeechRecognition' in window)&&!('SpeechRecognition' in window)){toast('Speech not supported in this browser');return;}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const recog=new SR();
  recog.continuous=false;recog.interimResults=false;recog.lang='en-GB';
  const btn=document.getElementById('voice-btn-'+targetId);
  if(btn){btn.style.color='var(--danger)';btn.textContent='\uD83D\uDD34';}
  recog.onresult=e=>{
    const text=e.results[0][0].transcript;
    const el=document.getElementById(targetId);
    if(el){el.value=(el.value?el.value+' ':'')+text;el.dispatchEvent(new Event('blur'));}
    if(btn){btn.style.color='';btn.textContent='\uD83C\uDF99';}
    toast('Transcribed!');
  };
  recog.onerror=e=>{if(btn){btn.style.color='';btn.textContent='\uD83C\uDF99';}toast('Voice error: '+e.error);};
  recog.onend=()=>{if(btn){btn.style.color='';btn.textContent='\uD83C\uDF99';}};
  recog.start();
}

let prayerTimesCache={};
async function fetchPrayerTimes(){
  const td=todayISO();

  try{

    </div>
    <div style="display:flex;gap:3px">${prayers.map(p=>{
      const isNext=next===p.n;
      const isPast=!isNext&&prayers.indexOf(p)<prayers.indexOf(prayers.find(x=>x.n===next));
      return `<div style="flex:1;padding:7px 4px;text-align:center;border-radius:var(--radius-xs);transition:all .15s;${isNext?'background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(0,113,227,.2)':isPast?'background:var(--card);border:1px solid var(--border);opacity:.5':'background:var(--card);border:1px solid var(--border)'}">
        <div style="font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:.04em;${isNext?'opacity:.85':'color:var(--text-light)'}">${p.n}</div>
        <div style="font-size:12px;font-weight:600;font-family:var(--mono);margin-top:1px;letter-spacing:-.02em">${p.t}</div>
      </div>`;
    }).join('')}</div>
  </div>`;
}

// FEATURE 4: CONTRIBUTION GRAPH
// ═══════════════════════════════════════
function smContributionGraph(){
  const filled=smFilledDates();
  const filledSet=new Set(filled);
  const intensity={};
  filled.forEach(d=>{
    const e=state.diary.entries[d];if(!e)return;
    let cnt=0;
    SM_ALL_AREAS.forEach(a=>{if(e[a]&&(e[a].score||e[a].repeat||e[a].improve||e[a].action))cnt++;});
    intensity[d]=cnt;
  });
  const maxI=Math.max(...Object.values(intensity),1);
  const end=new Date();const start=new Date(end);start.setDate(start.getDate()-364);
  start.setDate(start.getDate()-start.getDay());
  const cellSize=8,gap=1;
  const weeks=Math.ceil(365/7)+1;
  const w=weeks*(cellSize+gap)+24;
  let svg=`<svg width="${w}" height="74" viewBox="0 0 ${w} 74" style="display:block;width:100%">`;
  let week=0;
  const d=new Date(start);
  const monthLabels=[];let lastMonth=-1;
  const colors=['var(--border)','rgba(0,113,227,.15)','rgba(0,113,227,.3)','rgba(0,113,227,.5)','rgba(0,113,227,.75)'];
  let cellIdx=0;
  while(d<=end){
    const dow=d.getDay();
    const ds=d.toISOString().slice(0,10);
    const val=intensity[ds]||0;
    const lvl=val===0?0:Math.ceil((val/maxI)*4);
    const x=week*(cellSize+gap)+22;
    const y=dow*(cellSize+gap)+12;
    svg+=`<rect x="${x}" y="${y}" width="${cellSize}" height="${cellSize}" rx="1.5" fill="${colors[lvl]}" style="animation:fadeIn .3s ${cellIdx*2}ms both;cursor:pointer" onclick="state.diary.viewDate='${ds}';render()"><title>${ds}: ${val} areas</title></rect>`;
    if(d.getMonth()!==lastMonth){monthLabels.push({x,label:d.toLocaleDateString('en',{month:'short'})});lastMonth=d.getMonth();}
    if(dow===6)week++;
    d.setDate(d.getDate()+1);
    cellIdx++;
  }
  monthLabels.forEach(m=>{svg+=`<text x="${m.x}" y="9" font-size="7" fill="var(--text-light)" font-family="var(--font)">${m.label}</text>`;});
  svg+=`</svg>`;
  return svg;
}

function diaryPhoto(date){
