function capturePhoto(date){
  const input=document.createElement('input');
  input.type='file';input.accept='image/*';input.capture='environment';
  input.onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      // Resize to thumbnail
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement('canvas');
        const maxW=120;const scale=maxW/img.width;
        canvas.width=maxW;canvas.height=img.height*scale;
        canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
        const thumb=canvas.toDataURL('image/jpeg',0.6);
        const entry=smEntry(date);
        entry._photo=thumb;
        saveState();render();toast('Photo saved');
      };
      img.src=ev.target.result;
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

// FEATURE 6: MONTHLY REPORT
// ═══════════════════════════════════════
function generateMonthlyReport(){
  const now=new Date();
  const month=now.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  const ym=now.toISOString().slice(0,7);
  const s=getStats();
  const filled=smFilledDates().filter(d=>d.startsWith(ym));

  let md=`# Self Map & Action Report — ${month}\n\n`;
  md+=`## Action Tracker\n- **${s.total}** total actions, **${s.done}** completed (${Math.round(s.done/Math.max(s.total,1)*100)}%)\n- **${s.overdue}** overdue, **${s.prio}** priority\n\n`;

  // Project breakdown
  md+=`## Projects\n`;
  getProjects().forEach(p=>{
    const items=state.actions.filter(a=>a.project===p);
    const open=items.filter(a=>a.status!=='Done'&&a.status!=='Cancelled').length;
    md+=`- **${p}**: ${open} open / ${items.length} total\n`;
  });

  // Self Map
  md+=`\n## Self Map\n- **${filled.length}** entries this month\n\n`;
  if(filled.length){
    md+=`### Pillar Averages (${month})\n`;
    SM_PILLARS.forEach(pillar=>{
      const scores=[];
      filled.forEach(d=>{
        const e=state.diary.entries[d];if(!e)return;
        pillar.areas.forEach(a=>{const _n=typeof a==='object'?a.name:a;if(e[_n]?.score)scores.push(e[_n].score);});
      });
      const avg=scores.length?Math.round(scores.reduce((a,b)=>a+b,0)/scores.length*10)/10:0;
      md+=`- **${pillar.name}**: ${avg}/10\n`;
    });
  }

  // Download as .md
  const blob=new Blob([md],{type:'text/markdown'});
  Object.assign(document.createElement('a'),{href:URL.createObjectURL(blob),download:`selfmap_report_${ym}.md`}).click();
  toast('Report downloaded');
  return md;
}

function generateDigestContent(){
  const s=getStats();
  const td=todayISO();
  const filled=smFilledDates();
  const thisWeek=filled.filter(d=>{const diff=(new Date(td)-new Date(d))/864e5;return diff>=0&&diff<7;});

  let body=`Weekly Productivity Digest\n\n`;
  body+=`ACTIONS: ${s.total} total, ${s.done} done, ${s.overdue} overdue\n`;

  const overdue=state.actions.filter(a=>isOverdue(a.due,a.status)).slice(0,5);
  if(overdue.length){
    body+=`\nOVERDUE:\n`;
    overdue.forEach(a=>body+=`- ${a.action} (${a.owner}, due ${fmtDate(a.due)})\n`);
  }

  body+=`\nSELF MAP: ${thisWeek.length}/7 days filled this week\n`;

  if(thisWeek.length){
    body+=`Pillar scores this week:\n`;
    SM_PILLARS.forEach(p=>{
      const scores=[];
      thisWeek.forEach(d=>{const e=state.diary.entries[d];if(!e)return;p.areas.forEach(a=>{const _n=typeof a==='object'?a.name:a;if(e[_n]?.score)scores.push(e[_n].score);});});
      const avg=scores.length?(scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(1):'-';
      body+=`- ${p.name}: ${avg}/10\n`;
    });
  }

  body+=`\nGenerated ${new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}`;
  return body;
}

// RECURRING ACTIONS
// ═══════════════════════════════════════
function checkRecurring(){
  const td=todayISO();
  state.actions.forEach(a=>{
    if(!a.recur||a.status!=='Done')return;
    // Check if we need to spawn a new instance
    const lastDone=a.doneDate||a.due||td;
    const diff=Math.round((new Date(td)-new Date(lastDone))/864e5);
    let spawn=false;
    if(a.recur==='daily'&&diff>=1)spawn=true;
    if(a.recur==='weekly'&&diff>=7)spawn=true;
    if(a.recur==='monthly'&&diff>=30)spawn=true;
    if(spawn&&!state.actions.find(x=>x.recurParent===a.id&&x.status!=='Done')){
      const newDue=a.recur==='daily'?td:a.recur==='weekly'?new Date(Date.now()+7*864e5).toISOString().slice(0,10):new Date(Date.now()+30*864e5).toISOString().slice(0,10);
      state.actions.push({...a,id:uid(),status:'Open',due:newDue,createdAt:td,recurParent:a.id,todayFocus:a.todayFocus});
      saveState();
    }
  });
}

// SELF MAP SEARCH
// ═══════════════════════════════════════
function smSearch(query){
  if(!query||!query.trim())return[];
  const q=query.toLowerCase().trim();
  const results=[];
  const filled=smFilledDates();
  filled.forEach(d=>{
    const e=state.diary.entries[d];if(!e)return;
    SM_ALL_AREAS.forEach(area=>{
      const ae=e[area];if(!ae)return;
      const texts=[ae.repeat,ae.improve,ae.action].filter(Boolean).join(' ');
      if(texts.toLowerCase().includes(q)){
        results.push({date:d,area,score:ae.score,match:texts.slice(Math.max(0,texts.toLowerCase().indexOf(q)-30),texts.toLowerCase().indexOf(q)+q.length+60)});
      }
    });
  });
  return results.sort((a,b)=>b.date.localeCompare(a.date));
}
function renderSmSearch(){
  const q=state.smSearchQuery||'';
  const results=q?smSearch(q):[];
  let h=`<div style="margin-bottom:12px">

      <input class="input" style="flex:1;font-size:12px" value="${esc(q)}" placeholder="Search Self Map entries (anger, phone, prayer, wife...)" oninput="state.smSearchQuery=this.value" onkeydown="if(event.key==='Enter')render()">
      <button class="btn btn-primary" style="font-size:11px" onclick="render()">Search</button>
    </div>`;
  if(q&&results.length){
    h+=`<div style="font-size:10px;color:var(--text-light);margin-bottom:6px">${results.length} matches for "${esc(q)}"</div>`;
    results.slice(0,20).forEach(r=>{

      h+=`<div class="card card-hover" onclick="state.diary.viewDate='${r.date}';state.tab='diary';render()" style="padding:8px 12px;margin-bottom:4px;cursor:pointer;font-size:11px">

          <span style="font-weight:600">${esc(r.area)}</span>
          ${r.score?`<span style="font-size:9px;padding:1px 5px;border-radius:8px;background:var(--accent);color:#fff">${r.score}/10</span>`:''}
        </div>
        <div style="color:var(--text-mid);font-size:10.5px">...${highlighted}...</div>
      </div>`;
    });
    if(results.length>20) h+=`<div style="font-size:10px;color:var(--text-light);text-align:center;padding:4px">+ ${results.length-20} more</div>`;
  } else if(q){
    h+=`<div style="font-size:11px;color:var(--text-light);padding:12px;text-align:center">No matches found</div>`;

    h+=`<div style="font-size:11px;color:var(--text-light);padding:12px;text-align:center">Try: anger, phone, prayer, focus, wife, planning, consistency</div>`;
  }
  h+=`</div>`;
  return h;
}

    <div class="card" style="padding:18px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><div style="width:28px;height:28px;border-radius:14px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--accent)">1</div><div style="font-size:14px;font-weight:700">Quick reference</div></div><div style="font-size:12px;color:var(--text-mid);line-height:1.7"><span style="color:#8B72C4">\u2605</span> Toggle high priority<br><span style="color:var(--accent)">\u25C9</span> Toggle today focus<br><b>Click</b> any action to edit all fields<br><b>Shift+click</b> to multi-select in Projects<br><b>Drag</b> actions to reorder or move to projects<br><b>Archive</b> removes without permanent delete</div></div>
    <div class="card" style="padding:18px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><div style="width:28px;height:28px;border-radius:14px;background:rgba(48,209,88,.1);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--success)">2</div><div style="font-size:14px;font-weight:700">Cross-device sync</div></div><div style="font-size:12px;color:var(--text-mid);line-height:1.7">Sign in with Google to save to Drive.<br>Open <b>xahpos.github.io/Action-tracker</b> on any PC, sign in, same data.<br>Green dot = synced. Yellow = local only.<br><b>Pull</b> = force-reload from Drive.<br><b>Push</b> = force-save to Drive.</div></div>
    <div class="card" style="padding:18px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><div style="width:28px;height:28px;border-radius:14px;background:rgba(130,100,200,.1);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#8B72C4">3</div><div style="font-size:14px;font-weight:700">Import meetings</div></div><div style="font-size:12px;color:var(--text-mid);line-height:1.7">Paste a meeting transcript in the <b>Import</b> tab.<br>Uses 7-column format:<br><span style="font-family:var(--mono);font-size:10px">| # | Action | Owner | Due | Outcome | Project | Status |</span><br>Actions land in the right projects automatically.</div></div>
    <div class="card" style="padding:18px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><div style="width:28px;height:28px;border-radius:14px;background:rgba(200,170,60,.1);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#D4A04A">4</div><div style="font-size:14px;font-weight:700">Updating the app</div></div><div style="font-size:12px;color:var(--text-mid);line-height:1.7">Go to <b>github.com/Xahpos/Action-tracker</b><br>Edit index.html \u2192 Ctrl+A \u2192 paste new code \u2192 Commit<br>Wait 1-2 min \u2192 site updates<br>Data in Google Drive is untouched.</div></div>
  </div></div>`;
}

function renderNav() {
  const s = getStats();
  const nav = document.getElementById("nav");
  nav.innerHTML = TABS.map(t => {
    if(t.g) return `<div style="padding:0 12px;margin:14px 0 6px"><div style="font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:.1em;color:rgba(120,110,180,.3)">${t.g}</div></div>`;
    let badge = "";
    if (t.id==="inbox" && s.inbox>0) badge = `<span class="badge" style="background:${t.bg||'#6B7280'}">${s.inbox}</span>`;
    if (t.id==="today" && s.today>0) badge = `<span class="badge" style="background:${t.bg||'#6B7280'}">${s.today}</span>`;
    if (t.id==="actions" && s.overdue>0) badge = `<span class="badge" style="background:${t.bg||'#6B7280'}">${s.overdue}</span>`;
    return `<button class="${state.tab===t.id?'active':''}" onclick="state.tab='${t.id}';render()">
      <span style="opacity:.5;width:16px;display:flex;align-items:center;justify-content:center">${t.icon}</span>${t.label}${badge}</button>`;
  }).join("");
  document.getElementById("action-count").textContent = s.total + " actions";
}

function render() {
  try {
    // Removed tabs — redirect to today
    if(state.tab==='dashboard'||state.tab==='stats'){state.tab='today';}
    renderNav();
    renderBulkBar();
    const main = document.getElementById("main");
    const s = getStats();

    switch(state.tab) {
      case "today": main.innerHTML = renderToday(s); break;
      case "reflect": main.innerHTML = renderReflect(); break;
      case "inbox": main.innerHTML = renderInbox(s); break;
      case "actions": main.innerHTML = renderActions(s); break;
      case "kanban": main.innerHTML = renderKanban(); break;
      case "projects": main.innerHTML = renderProjects(); break;
      case "import": main.innerHTML = renderImport(); break;
      case "calendar": main.innerHTML = renderCalendar(); break;
      case "diary": main.innerHTML = renderDiary(); break;
      case "coach": main.innerHTML = renderCoach(); break;
      case "guide": main.innerHTML = renderGuide(); break;
      default: main.innerHTML = "";
    }
  } catch(err) {
    const main = document.getElementById("main");
    main.innerHTML = `<div style="padding:20px;font-family:monospace">
      <h2 style="color:var(--danger);margin-bottom:10px">Render error in tab: ${state.tab}</h2>
      <pre style="background:#1a1a2e;color:#e74c3c;padding:16px;border-radius:8px;overflow:auto;font-size:12px;line-height:1.6;white-space:pre-wrap">${esc(err.message)}\n\n${esc(err.stack||'')}</pre>
      <p style="margin-top:12px;color:var(--text-mid);font-size:12px">Copy this error and send it back. State debug:</p>
      <pre style="background:#1a1a2e;color:#4ADE80;padding:12px;border-radius:8px;font-size:11px;overflow:auto;max-height:200px;white-space:pre-wrap">tab: ${state.tab}
actions: ${state.actions?.length ?? 'undefined'}
selected type: ${typeof state.selected}
selected is Set: ${state.selected instanceof Set}
dragId: ${state.dragId}
dark: ${state.dark}</pre>
    </div>`;
    console.error('RENDER ERROR:', err);
  }
}

function renderToday(s) {
  const td = todayISO();
  const focused = state.actions.filter(a=>a.status!=="Done"&&a.status!=="Cancelled"&&a.todayFocus);
  const dueToday = state.actions.filter(a=>a.status!=="Done"&&a.status!=="Cancelled"&&a.due===td&&!a.todayFocus);
  const upcoming = state.actions.filter(a=>a.due&&a.status!=="Done"&&a.status!=="Cancelled"&&!a.todayFocus&&a.due!==td&&a.due<=new Date(Date.now()+7*864e5).toISOString().slice(0,10)).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,10);
  const dateStr = new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"});

  let h = pomodoroWidget();
  h += `<div class="fade-in"><div class="page-header">
    <div><h1>Today</h1><div class="subtitle">
    <div class="actions">
      ${!pomodoroState.running?`<button class="btn btn-default" style="font-size:11px;padding:5px 12px;display:flex;align-items:center;gap:5px" onclick="pomodoroStart()">${ICON.play} Focus 25m</button>`:''}
      </div>
  </div>`;
  h += quickAdd({todayFocus:true});
  h += `<div><p style="font-size:12px;color:var(--text-light);margin:2px 0 16px">${dateStr}</p></div>`;
  fetchPrayerTimes().then(t=>{const el=document.getElementById("prayer-slot");if(el&&t)el.innerHTML=prayerWidget(t);});
  h += `<div id="prayer-slot"></div>`;

  if (!focused.length && !dueToday.length) {
    h += `<div style="text-align:center;padding:60px 20px;color:var(--text-light)"><div style="font-size:15px;font-weight:600">Nothing for today</div><div style="font-size:12px;margin-top:4px">Mark actions with \u25C9 Today Focus</div></div>`;
  }

  if (focused.length) {
    h += `<div style="margin-bottom:16px"><div style="font-size:11px;font-weight:500;color:var(--accent);margin-bottom:10px;text-transform:uppercase;letter-spacing:.06em">\u25C9 Focus (${focused.length})</div>`;
    focused.forEach(a => {
      const sel = state.selected.has(a.id);
      h += `<div class="card card-hover" onclick="if(event.ctrlKey||event.metaKey||event.shiftKey){event.preventDefault();toggleSelect('${a.id}');return;}openEdit('${a.id}')" style="padding:10px 14px;margin-bottom:6px;cursor:pointer;display:flex;gap:8px;align-items:center;border-left:3px solid var(--accent);${sel?'background:var(--accent-soft)':''}">
        <input type="checkbox" ${sel?'checked':''} onclick="event.stopPropagation();toggleSelect('${a.id}')" style="flex-shrink:0">
        <div style="flex:1"><div style="display:flex;align-items:center;gap:6px">
          <span style="font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--text-mid)">${esc(a.num)}</span>
          <span style="font-size:13px;font-weight:500">${esc(a.action)}</span></div>
          <div style="display:flex;gap:6px;margin-top:3px"><span style="font-size:11px;color:var(--text-mid)">${esc(a.owner)}</span>${projTag(a.project)}${a.due?`<span style="font-size:10.5px;color:var(--text-mid)">${fmtDate(a.due)}</span>`:""}</div>
        </div>${actionBtns(a)}</div>`;
    });
    h += `</div>`;
  }

  if (dueToday.length) {
    h += `<div style="margin-bottom:16px"><div style="font-size:11px;font-weight:500;color:var(--danger);margin-bottom:10px;text-transform:uppercase;letter-spacing:.06em"> Due today (${dueToday.length})</div>`;
    dueToday.forEach(a => {
      const sel = state.selected.has(a.id);
      h += `<div class="card card-hover" onclick="if(event.ctrlKey||event.metaKey||event.shiftKey){event.preventDefault();toggleSelect('${a.id}');return;}openEdit('${a.id}')" style="padding:10px 14px;margin-bottom:6px;cursor:pointer;display:flex;gap:8px;align-items:center;border-left:3px solid var(--danger);${sel?'background:var(--accent-soft)':''}">
        <input type="checkbox" ${sel?'checked':''} onclick="event.stopPropagation();toggleSelect('${a.id}')" style="flex-shrink:0">
        <div style="flex:1"><span style="font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--text-mid)">${esc(a.num)}</span> <span style="font-size:13px">${esc(a.action)}</span>
          <div style="display:flex;gap:6px;margin-top:3px"><span style="font-size:11px;color:var(--text-mid)">${esc(a.owner)}</span>${projTag(a.project)}</div>
        </div>${actionBtns(a)}</div>`;
    });
    h += `</div>`;
  }

  if (upcoming.length) {
    h += `<div style="margin-top:8px;border-top:1px solid var(--border);padding-top:12px"><div style="font-size:11px;font-weight:500;color:var(--text-light);margin-bottom:10px;text-transform:uppercase;letter-spacing:.06em">Upcoming</div>`;
    upcoming.forEach(a => {
      h += `<div onclick="openEdit('${a.id}')" style="display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid var(--border);font-size:12px;cursor:pointer;border-radius:6px;transition:background .08s" onmouseover="this.style.background='var(--accent-soft)'" onmouseout="this.style.background=''">
        <span style="font-family:var(--mono);font-size:10px;font-weight:600;color:var(--text-mid);width:32px">${esc(a.num)}</span>
        <span style="flex:1">${esc(a.action)}</span>
        <span style="color:${isOverdue(a.due,a.status)?'var(--danger)':'var(--text-mid)'};font-size:10.5px;font-weight:600">${fmtDate(a.due)}</span>
        ${projTag(a.project)}<div onclick="event.stopPropagation()">${actionBtns(a)}</div></div>`;
    });
    h += `</div>`;
  }

  h += `</div>`;
  return h;
}

// INBOX TAB
// ═══════════════════════════════════════
function renderInbox(s) {
  // Filter state
  if(!state.inboxF) state.inboxF = {project:'All', owner:'All', reason:'All', search:''};
  const F = state.inboxF;
  
  // Full inbox before any filtering
  const inboxAll = state.actions.filter(a=>{
    if(a.status==="Done"||a.status==="Cancelled") return false;
    if(a.ongoing) return false;
    if(a.recur) return false;
    return (a.project==="Imported"||a.project==="Untagged"||!a.due||!a.measurable);
  });
  
  // Apply user filters
  const inbox = inboxAll.filter(a=>{
    if(F.project!=='All' && a.project!==F.project) return false;
    if(F.owner!=='All' && a.owner!==F.owner) return false;
    if(F.reason==='no-project' && !(a.project==="Imported"||a.project==="Untagged")) return false;
    if(F.reason==='no-due' && a.due) return false;
    if(F.reason==='no-outcome' && a.measurable) return false;
    if(F.search){
      const q=F.search.toLowerCase();
      if(!(a.action||'').toLowerCase().includes(q) && !(a.owner||'').toLowerCase().includes(q) && !(a.project||'').toLowerCase().includes(q)) return false;
    }
    return true;
  });
  
  // Get unique projects/owners present in the inbox for filter dropdowns
  const inboxProjs = [...new Set(inboxAll.map(a=>a.project).filter(Boolean))].sort();
  const inboxOwners = [...new Set(inboxAll.map(a=>a.owner).filter(Boolean))].sort();
  
  let h = quickAdd() + `<div class="fade-in"><div class="page-header"><div><h1>Inbox</h1><div class="subtitle">${inbox.length} of ${inboxAll.length} actions needing annotation</div></div></div>`;
  
  // Filter bar
  if(inboxAll.length){
    const hasFilter = F.project!=='All' || F.owner!=='All' || F.reason!=='All' || F.search;
    h += `<div class="card" style="padding:10px 12px;margin-bottom:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <input class="input" style="font-size:11px;padding:5px 8px;flex:1;min-width:140px" placeholder="Search inbox..." value="${esc(F.search)}" oninput="state.inboxF.search=this.value;renderDebounced()">
      <select class="select" style="font-size:11px;padding:5px 8px" onchange="state.inboxF.project=this.value;render()">
        <option value="All">All projects (${inboxProjs.length})</option>
        ${inboxProjs.map(p=>{
          const cnt=inboxAll.filter(a=>a.project===p).length;
          return `<option value="${esc(p)}" ${F.project===p?'selected':''}>${esc(p)} (${cnt})</option>`;
        }).join('')}
      </select>
      <select class="select" style="font-size:11px;padding:5px 8px" onchange="state.inboxF.owner=this.value;render()">
        <option value="All">All owners</option>
        ${inboxOwners.map(o=>`<option value="${esc(o)}" ${F.owner===o?'selected':''}>${esc(o)}</option>`).join('')}
      </select>
      <select class="select" style="font-size:11px;padding:5px 8px" onchange="state.inboxF.reason=this.value;render()">
        <option value="All">All issues</option>
        <option value="no-project" ${F.reason==='no-project'?'selected':''}>No project</option>
        <option value="no-due" ${F.reason==='no-due'?'selected':''}>No due date</option>
        <option value="no-outcome" ${F.reason==='no-outcome'?'selected':''}>No outcome</option>
      </select>
      ${hasFilter?`<button class="btn btn-ghost" style="font-size:10px;padding:4px 8px;color:var(--text-light)" onclick="state.inboxF={project:'All',owner:'All',reason:'All',search:''};render()">✕ Clear</button>`:''}
    </div>`;
  }
  
  if (!inbox.length) {
    if(inboxAll.length){
      h += `<div style="text-align:center;padding:40px 20px;color:var(--text-light)"><div style="font-size:13px">No matches for current filter</div><div style="font-size:11px;margin-top:6px">Clear filter to see all ${inboxAll.length} inbox items</div></div>`;
    } else {
      h += `<div style="text-align:center;padding:60px 20px;color:var(--text-light)"><div style="font-size:15px;font-weight:600">Inbox empty</div></div>`;
    }
  }
  if(inbox.length){
    const allSelected = inbox.every(a=>state.selected.has(a.id));
    h += `<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:6px 4px;font-size:11px;color:var(--text-light)">
      <input type="checkbox" id="inbox-select-all" onchange="if(this.checked){window._filteredIds=${JSON.stringify(inbox.map(a=>a.id))};selectAllFiltered(true)}else{state.selected.clear();render()}" ${allSelected?'checked':''}>
      <span>Select all ${inbox.length} ${inbox.length===1?'action':'actions'} shown</span>
      <span style="margin-left:auto;font-size:10px;opacity:.7">tip: ctrl/cmd+click for multi-select</span>
    </div>`;
  }
  inbox.forEach((a,i) => {
    const reasons = [];
    if (a.project==="Imported"||a.project==="Untagged") reasons.push("no project");
    if (!a.due&&!a.ongoing&&!a.recur) reasons.push("no due date");
    if (!a.measurable) reasons.push("no outcome");
    const sel = state.selected.has(a.id);
    h += `<div class="card card-hover" onclick="if(event.ctrlKey||event.metaKey||event.shiftKey){event.preventDefault();toggleSelect('${a.id}');return;}openEdit('${a.id}')" style="padding:12px 16px;margin-bottom:6px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;border-left:2px solid ${sel?'var(--accent)':'var(--accent)'};${sel?'background:var(--accent-soft)':''};animation:smSlideUp .25s cubic-bezier(.16,1,.3,1) both;animation-delay:${i*30}ms">
      <input type="checkbox" ${sel?'checked':''} onclick="event.stopPropagation();toggleSelect('${a.id}')" style="margin-top:3px;flex-shrink:0">
      <div style="flex:1"><div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
        <span style="font-family:var(--mono);font-size:11px;font-weight:600;color:var(--text-mid)">${esc(a.num)}</span>
        <span style="font-size:13px;font-weight:600">${esc(a.action)}</span></div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
          <span style="font-size:11.5px;color:var(--text-mid)">${esc(a.owner)}</span>${projTag(a.project)}</div>
        <div style="display:flex;gap:4px;margin-top:4px">${reasons.map(r=>`<span style="font-size:10px;padding:1px 6px;border-radius:3px;background:rgba(255,69,58,.06);color:var(--danger);font-weight:500">${r}</span>`).join("")}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:3px;flex-shrink:0" onclick="event.stopPropagation()">
        <select class="select" style="font-size:10px;width:130px" onchange="if(this.value==='__new__'){var n=prompt('New project name:');if(n&&n.trim()){patch('${a.id}',{project:n.trim()});}else{this.value='${esc(a.project)}';}return;}patch('${a.id}',{project:this.value})">
          ${getProjects().map(p=>`<option ${p===a.project?'selected':''}>${esc(p)}</option>`).join("")}
          <option value="__new__">+ New project...</option>
        </select>
        <input type="date" class="input" style="font-size:10px;width:130px" value="${a.due||''}" onchange="patch('${a.id}',{due:this.value})">
        <div style="display:flex;gap:3px;align-items:center;font-size:9px;color:var(--text-light);margin-top:1px">
          <button class="btn btn-ghost" style="padding:2px 6px;font-size:9.5px;flex:1" onclick="event.stopPropagation();patch('${a.id}',{ongoing:true});toast('Marked ongoing — out of inbox')" title="No due date needed (ongoing/follow-up)">No due needed</button>
          <select class="select" style="font-size:9.5px;padding:2px 4px;width:80px" onchange="patch('${a.id}',{recur:this.value});if(this.value)toast('Recurring — out of inbox')">
            <option value="">Make recurring</option><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option>
          </select>
        </div>
        ${actionBtns(a)}
      </div></div>`;
  });
  h += `</div>`;
  return h;
}

// ═══════════════════════════════════════
function renderDashboard(s) {

      <div style="text-align:center;min-width:48px"><div style="font-size:20px;font-weight:600;line-height:1">${s.level}</div><div style="font-size:9px;opacity:0.6;text-transform:uppercase;letter-spacing:0.08em">Level</div></div>
      <div style="flex:1"><div style="display:flex;justify-content:space-between;font-size:10px;opacity:0.7;margin-bottom:3px"><span>${s.xpInLevel}/100 XP</span><span>${s.xp} total</span></div>
        <div style="height:5px;background:rgba(255,255,255,0.1);border-radius:3px"><div class="progress-fill" style="height:5px;background:linear-gradient(90deg,#4A7BF7,#8B5CF6);border-radius:3px;width:${s.xpInLevel}%"></div></div>
      </div>
      <div style="text-align:center;min-width:48px"><div style="font-size:20px;font-weight:600;line-height:1">${s.done}</div><div style="font-size:9px;opacity:0.6;text-transform:uppercase;letter-spacing:0.08em">Done</div></div>
      <div style="text-align:center;min-width:48px"><div style="font-size:20px;font-weight:600;line-height:1">${Math.round(s.done/Math.max(s.total,1)*100)}%</div><div style="font-size:9px;opacity:0.6;text-transform:uppercase;letter-spacing:0.08em">Complete</div></div>
    </div>
    <div class="page-header">
      <h1>Dashboard</h1><div class="actions">
      <button class="btn btn-default" style="font-size:11px" onclick="weeklyReview()">Weekly Review</button>
    </div></div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:20px">`;
  [["Total",s.total,"#4A7BF7"],["Open",s.open,"#F59E0B"],["In Prog",s.prog,"#3B82F6"],["Done",s.done,"#30A46C"],["Overdue",s.overdue,"#DC2626"],["Priority",s.prio,"#D946EF"]].forEach(([l,v,c])=>{
    h+=`<div class="card" style="padding:14px;text-align:center"><div style="font-size:24px;font-weight:800;color:${c}">${v}</div><div style="font-size:10px;color:var(--text-light);text-transform:uppercase;letter-spacing:0.06em;margin-top:2px">${l}</div></div>`;
  });
  h += `</div>`;

  // Priority section
  const prio = state.actions.filter(a=>a.priority&&a.status!=="Done"&&a.status!=="Cancelled");
  if (prio.length) {
    h += `<div class="card" style="border:1px solid #F0ABFC;padding:12px;margin-bottom:12px"><div style="font-size:12px;font-weight:700;color:#86198F;margin-bottom:6px">\u2605 High Priority</div>`;
    prio.forEach(a => {
      h += `<div style="display:flex;align-items:center;gap:6px;padding:4px 0;font-size:12px;border-bottom:1px solid #F5D0FE;flex-wrap:wrap">
        <span style="font-family:var(--mono);font-size:10px;font-weight:600;width:32px">${esc(a.num)}</span>
        <span style="flex:1;min-width:140px">${esc(a.action)}</span>
        ${projTag(a.project)}<span style="font-size:10.5px;color:var(--text-mid)">${esc(a.owner)}</span>
        ${actionBtns(a)}</div>`;
    });
    h += `</div>`;
  }

  // Overdue section
  const od = state.actions.filter(a=>isOverdue(a.due,a.status)).slice(0,8);
  if (od.length) {
    h += `<div class="card" style="border:1px solid #FED7AA;padding:12px;margin-bottom:16px"><div style="font-size:12px;font-weight:700;color:#9A3412;margin-bottom:6px"> Overdue</div>`;
    od.forEach(a => {
      h += `<div style="display:flex;align-items:center;gap:6px;padding:4px 0;font-size:12px;border-bottom:1px solid #FED7AA;flex-wrap:wrap">
        <span style="font-family:var(--mono);font-size:10px;font-weight:600;width:32px">${esc(a.num)}</span>
        <span style="flex:1;min-width:140px">${esc(a.action)}</span>
        ${projTag(a.project)}${actionBtns(a)}</div>`;
    });
    h += `</div>`;
  }

  // Owner pills
  const owners = getOwners().slice(0,12);
  h += `<div style="margin-bottom:16px"><div style="font-size:11px;font-weight:700;color:var(--text-light);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">By owner</div><div style="display:flex;gap:5px;flex-wrap:wrap">`;
  owners.forEach(o => {
    const cnt = state.actions.filter(a=>a.owner.includes(o)&&a.status!=="Done"&&a.status!=="Cancelled").length;
    if(!cnt) return;
    h += `<button class="btn btn-default" style="padding:4px 10px;font-size:11px" onclick="state.tab='actions';state.fOwner='${esc(o)}';render()">${esc(o)} <span style="opacity:.5">${cnt}</span></button>`;
  });
  h += `</div></div>`;

  // Project cards
  h += `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px">`;
  getProjects().forEach(p => {
    const it = state.actions.filter(a=>a.project===p);

  });
  h += `</div></div>`;
  return h;
}

// ═══════════════════════════════════════
// STATS TAB
// ═══════════════════════════════════════
function renderStatsTab(s) {
  const byProj = getProjects().map(p => {
    const all = state.actions.filter(a=>a.project===p);
    return {name:p.length>20?p.slice(0,18)+"..":p, open:all.filter(a=>a.status==="Open"||a.status==="In progress").length, done:all.filter(a=>a.status==="Done").length, total:all.length};
  }).filter(p=>p.total>0);
  const maxProj = Math.max(...byProj.map(p=>p.total), 1);

  const byOwner = getOwners().slice(0,10).map(o => {
    const all = state.actions.filter(a=>a.owner.includes(o));
    return {name:o.length>12?o.slice(0,10)+"..":o, open:all.filter(a=>a.status!=="Done"&&a.status!=="Cancelled").length, done:all.filter(a=>a.status==="Done").length};
  });
  const maxOwner = Math.max(...byOwner.map(o=>o.open+o.done), 1);

  // ── Green Line: compute from Self Map habit scores ──
  const smFilled = typeof smFilledDates==='function' ? smFilledDates() : [];
  const habitAreas = ["Prayer","Weightlifting","Cardio","Intermittent fasting","Self Map"];
  const disciplineAreas = ["Effort","Consistency","Self respect (delayed gratification)"];
  const mindAreas = ["Focus/Attention","Planning & Productivity","Learning how to learn","Emotional Stability/Stoicism"];
  const relationAreas = ["Wife","Family","Friends","Communication"];
  function areaAvgStat(areas, entries, dates){
    const scores=[];
    dates.forEach(d=>{const e=entries[d];if(!e)return;areas.forEach(a=>{const _n=typeof a==='object'?a.name:a;if(e[_n]&&e[_n].score)scores.push(e[_n].score);});});
    return scores.length?(scores.reduce((a,b)=>a+b,0)/scores.length):0;
  }
  const entries = (state.diary&&state.diary.entries)||{};
  const recent30 = smFilled.slice(-30);
  const recent7 = smFilled.slice(-7);
  const greenPillars = [
    {name:"Habits", areas:habitAreas, color:"#5A9E7E", icon:"◎"},
    {name:"Discipline", areas:disciplineAreas, color:"#CF6F6F", icon:"⬡"},
    {name:"Mind", areas:mindAreas, color:"#5B8DEF", icon:"◈"},
    {name:"Relations", areas:relationAreas, color:"#9B8ADE", icon:"◇"},
  ];
  const pillarScores = greenPillars.map(p=>({...p, score: areaAvgStat(p.areas, entries, recent30)}));
  const activePillars = pillarScores.filter(p=>p.score>0);
  const greenScore = activePillars.length>0 ? activePillars.reduce((s,p)=>s+p.score,0)/activePillars.length : 0;
  const greenScore7 = greenPillars.reduce((s,p)=>s+areaAvgStat(p.areas,entries,recent7)/greenPillars.length,0);
  const greenTrend = greenScore7 > greenScore+0.2 ? "↑" : greenScore7 < greenScore-0.2 ? "↓" : "→";
  const completionRate = s.total>0?Math.round(s.done/s.total*100):0;
  const inProg = state.actions.filter(a=>a.status==="In progress").length;
  const velocity = state.meetings.length>0?Math.round((s.done/state.meetings.length)*10)/10:0;
  const overdueRate = (s.open+inProg)>0?Math.round(s.overdue/(s.open+inProg)*100):0;

  let h = `<div class="fade-in"><div class="page-header"><h1>Stats</h1></div>`;

  // ═══ THE TWO LINES ═══
  h += `<div class="card" style="padding:20px;margin-bottom:14px;background:linear-gradient(135deg,#0F1923 0%,#1A2535 100%);color:#fff;border:none">
    <div style="font-size:10px;text-transform:uppercase;letter-spacing:.1em;opacity:.4;margin-bottom:14px">Your two lines</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
      <div style="padding:16px;background:rgba(90,158,126,.12);border:1px solid rgba(90,158,126,.25);border-radius:10px">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
          <div style="width:10px;height:10px;border-radius:50%;background:#5A9E7E;box-shadow:0 0 8px #5A9E7E"></div>
          <span style="font-size:11px;font-weight:600;color:#5A9E7E;text-transform:uppercase;letter-spacing:.06em">Green Line — Intrinsic Value</span>
        </div>
        <div style="font-size:36px;font-weight:700;color:#5A9E7E;line-height:1">${greenScore>0?greenScore.toFixed(1):"—"}<span style="font-size:16px;opacity:.6">/10</span> <span style="font-size:18px">${greenScore>0?greenTrend:""}</span></div>
        <div style="font-size:10px;color:rgba(255,255,255,.4);margin:4px 0 12px">30-day Self Map average · who you're becoming</div>
        ${pillarScores.map(p=>{const pct=p.score>0?p.score/10*100:0;return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:5px">
          <span style="font-size:9px;color:${p.color};width:62px;flex-shrink:0">${p.name}</span>
          <div style="flex:1;height:4px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden"><div style="width:${pct}%;height:100%;background:${p.color};border-radius:2px;transition:width .6s"></div></div>
          <span style="font-size:10px;color:rgba(255,255,255,.45);width:26px;text-align:right">${p.score>0?p.score.toFixed(1):"—"}</span>
        </div>`;}).join("")}
        ${smFilled.length===0?`<div style="font-size:10px;color:rgba(255,255,255,.3);margin-top:10px;font-style:italic">Log in Self Map to see your green line grow</div>`:`<div style="font-size:9px;color:rgba(255,255,255,.25);margin-top:8px">${smFilled.length} entries tracked</div>`}
      </div>
      <div style="padding:16px;background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.2);border-radius:10px">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
          <div style="width:10px;height:10px;border-radius:50%;background:#F59E0B;box-shadow:0 0 8px #F59E0B"></div>
          <span style="font-size:11px;font-weight:600;color:#F59E0B;text-transform:uppercase;letter-spacing:.06em">Orange Line — Outcomes</span>
        </div>
        <div style="font-size:36px;font-weight:700;color:#F59E0B;line-height:1">${completionRate}<span style="font-size:16px;opacity:.6">%</span></div>
        <div style="font-size:10px;color:rgba(255,255,255,.4);margin:4px 0 12px">completion rate · what's visible right now</div>
        ${[["Done",s.done,"#30D158"],["Open",s.open,"#F59E0B"],["Overdue",s.overdue,"#FF453A"],["In Progress",inProg,"#3B82F6"]].map(([l,v,c])=>`
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:5px">
            <span style="font-size:9px;color:rgba(255,255,255,.4);width:62px;flex-shrink:0">${l}</span>
            <div style="flex:1;height:4px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden"><div style="width:${s.total?Math.round(v/s.total*100):0}%;height:100%;background:${c};border-radius:2px;transition:width .6s"></div></div>
            <span style="font-size:10px;color:rgba(255,255,255,.45);width:26px;text-align:right">${v}</span>
          </div>`).join("")}
        <div style="font-size:10px;color:rgba(255,255,255,.25);margin-top:10px;font-style:italic;line-height:1.5">The orange line always reverts to the green line. Build the green line.</div>
      </div>
    </div>
  </div>`;

  // ─ Green line detail: habit areas ─
  if(smFilled.length>0){
    h+=`<div class="card" style="padding:18px;margin-bottom:14px">
      <div style="font-size:13px;font-weight:700;margin-bottom:4px">Green Line — Habit breakdown</div>
      <div style="font-size:11px;color:var(--text-light);margin-bottom:14px">${smFilled.length} Self Map entries &nbsp;·&nbsp; 30-day area averages</div>`;
    greenPillars.forEach(pillar=>{
      h+=`<div style="margin-bottom:14px"><div style="font-size:10px;font-weight:700;color:${pillar.color};text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">${pillar.icon} ${pillar.name}</div>`;
      pillar.areas.forEach(area=>{
        const scores=[];
        recent30.forEach(d=>{const e=entries[d];if(e&&e[area]&&e[area].score)scores.push(e[area].score);});
        const avg=scores.length?(scores.reduce((a,b)=>a+b,0)/scores.length):0;
        const trend7val=areaAvgStat([area],entries,recent7);
        const tr=scores.length>0&&trend7val>avg+0.3?"↑":trend7val<avg-0.3?"↓":"";
        h+=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
          <span style="font-size:10.5px;color:var(--text-mid);width:170px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(area)}</span>
          <div style="flex:1;height:5px;background:var(--border-vis);border-radius:3px;overflow:hidden">
            <div style="width:${avg>0?avg/10*100:0}%;height:100%;background:${pillar.color};border-radius:3px;transition:width .5s;opacity:${avg>0?1:0.25}"></div>
          </div>
          <span style="font-size:10px;color:var(--text-light);width:38px;text-align:right">${avg>0?avg.toFixed(1)+tr:"—"}</span>
        </div>`;
      });
      h+=`</div>`;
    });
    h+=`</div>`;
  }

  // ─ Orange line: velocity ─
  if(state.meetings.length>0){
    const recentMeetings=state.meetings.slice(-12);
    const maxActs=Math.max(...recentMeetings.map(m=>m.count||0),1);
    h+=`<div class="card" style="padding:18px;margin-bottom:14px">
      <div style="font-size:13px;font-weight:700;margin-bottom:4px">Orange Line — Action velocity</div>
      <div style="font-size:11px;color:var(--text-light);margin-bottom:12px">
        <b style="color:var(--text)">${velocity}</b> done/meeting &nbsp;·&nbsp; overdue rate <b style="color:${overdueRate>30?'var(--danger)':'var(--text)'}">${overdueRate}%</b> &nbsp;·&nbsp; ${s.total} captured total
      </div>
      <div style="display:flex;align-items:flex-end;gap:3px;height:52px">`;
    recentMeetings.forEach(m=>{
      const hh=Math.max(Math.round((m.count||0)/maxActs*52),2);
      h+=`<div style="flex:1" title="${esc(m.name)}: ${m.count} actions">
        <div style="width:100%;background:#F59E0B;border-radius:2px 2px 0 0;height:${hh}px;opacity:.65"></div>
      </div>`;
    });
    h+=`</div>
      <div style="display:flex;justify-content:space-between;margin-top:3px">
        <span style="font-size:9px;color:var(--text-light)">${esc(recentMeetings[0]?.name||"")}</span>
        <span style="font-size:9px;color:var(--text-light)">${esc(recentMeetings[recentMeetings.length-1]?.name||"")}</span>
      </div>
    </div>`;
  }


  // By project bar chart (CSS)
  h += `<div class="card" style="padding:18px;margin-bottom:14px"><div style="font-size:13px;font-weight:700;margin-bottom:12px">By project</div>`;
  byProj.forEach(p => {
    const col = WS_COLORS[p.name]||"#94A3B8";
    h += `<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
      <span style="font-size:10.5px;color:var(--text-mid);width:120px;text-align:right;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.name)}</span>
      <div style="flex:1;height:10px;background:var(--border-vis);border-radius:4px;overflow:hidden;display:flex">
        <div style="width:${p.done/maxProj*100}%;height:100%;background:var(--success);transition:width 0.5s"></div>
        <div style="width:${p.open/maxProj*100}%;height:100%;background:${col};transition:width 0.5s"></div>
      </div>
      <span style="font-size:10px;color:var(--text-light);width:30px">${p.total}</span></div>`;
  });
  h += `<div style="display:flex;gap:12px;margin-top:8px;font-size:10px;color:var(--text-light)">
    <span style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:2px;background:var(--success)"></span> Done</span>
    <span style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:2px;background:var(--accent)"></span> Open</span></div></div>`;

  // By owner bar chart (CSS)
  h += `<div class="card" style="padding:18px;margin-bottom:14px"><div style="font-size:13px;font-weight:700;margin-bottom:12px">By owner</div>`;
  byOwner.forEach(o => {
    h += `<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
      <span style="font-size:10.5px;color:var(--text-mid);width:80px;text-align:right;flex-shrink:0">${esc(o.name)}</span>
      <div style="flex:1;height:8px;background:var(--border-vis);border-radius:4px;overflow:hidden;display:flex">
        <div style="width:${o.done/maxOwner*100}%;height:100%;background:var(--success)"></div>
        <div style="width:${o.open/maxOwner*100}%;height:100%;background:var(--accent)"></div>
      </div>
      <span style="font-size:10px;color:var(--text-light);width:24px">${o.open+o.done}</span></div>`;
  });
  h += `</div></div>`;

  // Status pie (CSS conic-gradient)
  const statusCounts=STATUSES.map(s=>({s,n:state.actions.filter(a=>a.status===s).length})).filter(x=>x.n>0);
  const total=state.actions.length||1;
  let angle=0;const slices=statusCounts.map(x=>{const deg=x.n/total*360;const r={s:x.s,n:x.n,start:angle,end:angle+deg,c:stColors()[x.s]?.bg||'rgba(0,0,0,.04)'};angle+=deg;return r;});
  const conic=slices.map(r=>`${r.c} ${r.start}deg ${r.end}deg`).join(',');
  h+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">
    <div class="card" style="padding:18px"><div style="font-size:13px;font-weight:700;margin-bottom:12px">Status breakdown</div>
      <div style="display:flex;align-items:center;gap:20px">
        <div style="width:100px;height:100px;border-radius:50%;background:conic-gradient(${conic});flex-shrink:0"></div>
        <div>${slices.map(r=>`<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px"><div style="width:10px;height:10px;border-radius:2px;background:${r.c}"></div><span style="font-size:11px;color:var(--text-mid)">${r.s}: ${r.n}</span></div>`).join('')}</div>
      </div></div>
    <div class="card" style="padding:18px"><div style="font-size:13px;font-weight:700;margin-bottom:12px">Keyboard shortcuts</div>
      <div style="font-size:11.5px;color:var(--text-mid);line-height:1.8">
        <b>n</b> — New action<br><b>t</b> — Today view<br><b>i</b> — Inbox<br><b>a</b> — Actions<br><b>p</b> — Projects<br><b>/</b> — Search<br><b>d</b> — Dark mode
      </div></div>
  </div>`;

  return h;
}
// ═══════════════════════════════════════
function renderActions(s) {
  let filtered = state.actions;
  if (state.fStatus==="Active") filtered = filtered.filter(a=>a.status!=="Done"&&a.status!=="Cancelled");
  else if (state.fStatus!=="All") filtered = filtered.filter(a=>a.status===state.fStatus);
  if (state.fProj!=="All") filtered = filtered.filter(a=>a.project===state.fProj);
  if (state.fOwner!=="All") filtered = filtered.filter(a=>a.owner.includes(state.fOwner));
  if (state.fPrio) filtered = filtered.filter(a=>a.priority);
  if (state.fDate) { if(state.fDate==="today") filtered=filtered.filter(a=>a.createdAt===todayISO()); else if(state.fDate==="week"){const w=new Date();w.setDate(w.getDate()-7);const ws=w.toISOString().slice(0,10);filtered=filtered.filter(a=>a.createdAt>=ws);} else filtered=filtered.filter(a=>a.createdAt===state.fDate); }
  if (state.search) { const q=state.search.toLowerCase(); filtered=filtered.filter(a=>(a.action+a.num+a.owner).toLowerCase().includes(q)); }

  let h = quickAdd() + `<div class="fade-in"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <div><h1>Actions</h1><div class="subtitle">${filtered.length} of ${state.actions.length}</div></div>
    <div class="actions"><button class="btn btn-primary" onclick="openAddModal()">+ Add</button><button class="btn btn-default" onclick="exportJSON()">JSON</button><button class="btn btn-default" onclick="exportMD()">MD</button></div></div>
    <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px">
      <input class="input" id="search-input" style="flex:1;min-width:120px" placeholder="Search... (press /)" value="${esc(state.search)}" oninput="state.search=this.value;renderDebounced()">
      <button class="btn ${state.fPrio?'btn-primary':'btn-default'}" onclick="state.fPrio=!state.fPrio;render()">\u2605 Priority</button>
      <select class="select" onchange="state.fStatus=this.value;render()">
        <option ${state.fStatus==="Active"?"selected":""}>Active</option><option ${state.fStatus==="All"?"selected":""}>All</option>
        ${STATUSES.map(s=>`<option ${state.fStatus===s?"selected":""}>${s}</option>`).join("")}</select>
      <select class="select" onchange="state.fProj=this.value;render()">
        <option value="All" ${state.fProj==="All"?"selected":""}>All projects</option>
        ${getProjects().map(p=>`<option ${state.fProj===p?"selected":""}>${esc(p)}</option>`).join("")}</select>
      <select class="select" onchange="state.fOwner=this.value;render()">
        <option value="All" ${state.fOwner==="All"?"selected":""}>All owners</option>
        ${getOwners().map(o=>`<option ${state.fOwner===o?"selected":""}>${esc(o)}</option>`).join("")}</select>
      <select class="select" onchange="state.fDate=this.value;render()">
        <option value="" ${!state.fDate?"selected":""}>All dates</option>
        <option value="today" ${state.fDate==="today"?"selected":""}>Added today</option>
        <option value="week" ${state.fDate==="week"?"selected":""}>This week</option>
      </select>
    </div>${bulkBar()}`;

  // Store filtered IDs for select-all
  const fids = filtered.map(a=>a.id);
  if (!filtered.length) {
    h += `<div style="text-align:center;padding:40px;color:var(--text-light)">No actions match filters</div>`;
  } else {
    const cv=state.colVis||{};
    const colToggleBtn=`<div style="display:flex;gap:3px;flex-wrap:wrap;margin-bottom:8px;align-items:center">
      <span style="font-size:10px;color:var(--text-light);margin-right:4px">Columns:</span>
      ${[['owner','Owner'],['added','Added'],['due','Due'],['status','Status'],['project','Project']].map(([k,l])=>`<button onclick="state.colVis['${k}']=!state.colVis['${k}'];savePrefs();render()" style="padding:2px 8px;border-radius:12px;border:1px solid var(--border-vis);background:${cv[k]!==false?'var(--accent)':'var(--card)'};color:${cv[k]!==false?'#fff':'var(--text-mid)'};font-size:10px;cursor:pointer;font-family:var(--font)">${l}</button>`).join('')}
    </div>`;
    h += colToggleBtn;
    h += `<div class="card" style="overflow:auto;border-radius:8px"><table><thead><tr>
      <th style="width:28px"><input type="checkbox" onchange="selectAllFiltered(this.checked)"></th>
      <th>Action</th>
      ${cv.owner!==false?'<th>Owner</th>':''}
      ${cv.added!==false?'<th>Added</th>':''}
      ${cv.due!==false?'<th>Due</th>':''}
      ${cv.status!==false?'<th>Status</th>':''}
      ${cv.project!==false?'<th>Project</th>':''}
      <th></th>
    </tr></thead><tbody>`;
    // Save filtered IDs globally for select-all
    window._filteredIds = fids;
    filtered.forEach(a => {
      const od = isOverdue(a.due,a.status);
      const sel = state.selected.has(a.id);
      h += `<tr onclick="if(event.ctrlKey||event.metaKey||event.shiftKey){event.preventDefault();toggleSelect('${a.id}');return;}openEdit('${a.id}')" oncontextmenu="if(state.selected.size>0){showBulkMenu(event);}else{event.preventDefault();toggleSelect('${a.id}');showBulkMenu(event);}" style="cursor:pointer;background:${sel?'var(--accent-soft)':od?'rgba(255,69,58,.03)':'transparent'}">
        <td onclick="event.stopPropagation()"><input type="checkbox" ${sel?'checked':''} onchange="toggleSelect('${a.id}')"></td>
        <td style="max-width:280px"><div style="font-weight:${a.priority?600:500}">${a.priority?'<span style="color:#D946EF;margin-right:4px">\u2605</span>':''}${esc(a.action)}</div></td>
        ${cv.owner!==false?`<td><span style="font-weight:600;font-size:12px">${esc(a.owner)}</span></td>`:''}
        ${cv.added!==false?`<td><span style="font-size:11px;color:var(--text-light)">${a.createdAt?fmtDate(a.createdAt):'—'}</span></td>`:''}
        ${cv.due!==false?`<td>${a.due?`<span style="color:${dueColor(a.due,a.status)};font-weight:${isOverdue(a.due,a.status)?700:500}">${fmtDate(a.due)}</span>`:''}</td>`:''}
        ${cv.status!==false?`<td>${statusBadge(a.status)}</td>`:''}
        ${cv.project!==false?`<td>${projTag(a.project,a.subproject)}</td>`:''}
        <td onclick="event.stopPropagation()">${actionBtns(a)}</td></tr>`;
    });
    h += `</tbody></table></div>`;
  }

  // Archive
  if (state.archived.length) {
    h += `<details style="margin-top:16px"><summary style="font-size:12px;color:var(--text-light);cursor:pointer;font-weight:600">Archive (${state.archived.length})</summary>
      <div class="card" style="padding:12px;margin-top:6px">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border)">
          <span style="font-size:11px;color:var(--text-light)">${state.archived.length} archived ${state.archived.length===1?'action':'actions'}</span>
          <div style="display:flex;gap:6px">
            <button class="btn btn-ghost" style="font-size:10px;padding:3px 8px" onclick="if(!confirm('Restore all '+state.archived.length+' archived actions?'))return;state.actions.push(...state.archived.map(a=>{const{archivedAt,...rest}=a;return rest;}));state.archived=[];saveState();render();toast('All restored')">Restore all</button>
            <button class="btn btn-danger" style="font-size:10px;padding:3px 8px" onclick="if(!confirm('Delete all '+state.archived.length+' archived actions FOREVER? This cannot be undone.'))return;state.archived=[];saveState();render();toast('Archive cleared')">Empty archive</button>
          </div>
        </div>`;
    state.archived.forEach(a => {
      const archDate=a.archivedAt?new Date(a.archivedAt+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'';
      h += `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px">
        <span style="font-family:var(--mono);font-size:10px;font-weight:600;color:var(--text-light);width:32px">${esc(a.num)}</span>
        <span style="flex:1;color:var(--text-light);text-decoration:line-through">${esc(a.action)}</span>
        ${archDate?`<span style="font-size:9px;color:var(--text-light);font-style:italic">archived ${archDate}</span>`:''}
        ${projTag(a.project)}
        <button class="btn btn-ghost" style="font-size:10px;padding:2px 6px;color:var(--accent)" onclick="restoreAction('${a.id}')" title="Move back to active">Restore</button>
        <button class="btn btn-ghost" style="font-size:10px;padding:2px 6px;color:var(--danger)" onclick="if(!confirm('Delete this archived action FOREVER? This cannot be undone.'))return;state.archived=state.archived.filter(x=>x.id!=='${a.id}');saveState();render();toast('Deleted permanently')" title="Delete forever">Delete</button>
      </div>`;
    });
    h += `</div></details>`;
  }

  h += `</div>`;
  return h;
}

// ═══ RENAME PROJECT / SUB-PROJECT ═══
function renameProject(oldName){
  const m=document.createElement('div');m.className='modal-overlay';m.onclick=e=>{if(e.target===m)m.remove();};
  m.innerHTML='<div class="modal" style="max-width:360px"><h3 style="font-size:15px;font-weight:700;margin-bottom:10px">Rename project</h3><input class="input" id="rp-input" style="width:100%;margin-bottom:12px;font-size:13px" value="'+esc(oldName)+'" autofocus onkeydown="if(event.key===\'Enter\')document.getElementById(\'rp-confirm\').click()"><div style="display:flex;gap:6px;justify-content:flex-end"><button class="btn btn-ghost" onclick="this.closest(\'.modal-overlay\').remove()">Cancel</button><button class="btn btn-primary" id="rp-confirm" onclick="doRenameProject(\''+esc(oldName)+'\',document.getElementById(\'rp-input\').value.trim())">Rename</button></div></div>';
  document.body.appendChild(m);setTimeout(()=>{const el=document.getElementById('rp-input');if(el){el.focus();el.select();}},50);
}
function doRenameProject(oldName,newName){
  if(!newName||newName===oldName){document.querySelector('.modal-overlay')?.remove();return;}
  state.actions.forEach(a=>{if(a.project===oldName)a.project=newName;});
  if(state.subProjects[oldName]){state.subProjects[newName]=state.subProjects[oldName];delete state.subProjects[oldName];}
  saveState();document.querySelector('.modal-overlay')?.remove();render();toast('Renamed to '+newName);
}

function renameSubProject(proj,oldSub){
  const label=subLabel(oldSub);
  const m=document.createElement('div');m.className='modal-overlay';m.onclick=e=>{if(e.target===m)m.remove();};
  m.innerHTML='<div class="modal" style="max-width:360px"><h3 style="font-size:15px;font-weight:700;margin-bottom:4px">Rename sub-project</h3><p style="font-size:11px;color:var(--text-mid);margin-bottom:10px">in '+esc(proj)+'</p><input class="input" id="rsp-input" style="width:100%;margin-bottom:12px;font-size:13px" value="'+esc(label)+'" autofocus onkeydown="if(event.key===\'Enter\')document.getElementById(\'rsp-confirm\').click()"><div style="display:flex;gap:6px;justify-content:flex-end"><button class="btn btn-ghost" onclick="this.closest(\'.modal-overlay\').remove()">Cancel</button><button class="btn btn-primary" id="rsp-confirm" onclick="doRenameSub(\''+esc(proj)+'\',\''+esc(oldSub)+'\',document.getElementById(\'rsp-input\').value.trim())">Rename</button></div></div>';
  document.body.appendChild(m);setTimeout(()=>{const el=document.getElementById('rsp-input');if(el){el.focus();el.select();}},50);
}
function doRenameSub(proj,oldFull,newLabel){
  if(!newLabel){document.querySelector('.modal-overlay')?.remove();return;}
  const subs=state.subProjects[proj]||[];
  const parent=oldFull.split('/').slice(0,-1).join('/');
  const newFull=parent?parent+'/'+newLabel:newLabel;
  if(newFull===oldFull){document.querySelector('.modal-overlay')?.remove();return;}
  subs.forEach((s,i)=>{if(s===oldFull)subs[i]=newFull;else if(s.startsWith(oldFull+'/'))subs[i]=newFull+s.slice(oldFull.length);});
  state.actions.forEach(a=>{if(a.project===proj){if(a.subproject===oldFull)a.subproject=newFull;else if(a.subproject&&a.subproject.startsWith(oldFull+'/'))a.subproject=newFull+a.subproject.slice(oldFull.length);}});
  saveState();document.querySelector('.modal-overlay')?.remove();render();toast('Renamed');
}

    bar.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--card-solid);border:1px solid var(--border-vis);border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.18);padding:10px 14px;z-index:1500;display:flex;align-items:center;gap:8px;font-family:var(--font);animation:smSlideUp .2s cubic-bezier(.16,1,.3,1) both;flex-wrap:wrap;max-width:calc(100vw - 40px)';
    document.body.appendChild(bar);

    <button class="btn btn-ghost" style="font-size:11px;padding:5px 10px" onclick="state.selected.forEach(id=>patch(id,{todayFocus:true}));toast(state.selected.size+' added to Today');state.selected.clear();render()">◉ Today</button>
    <button class="btn btn-ghost" style="font-size:11px;padding:5px 10px" onclick="state.selected.forEach(id=>patch(id,{ongoing:true}));toast(state.selected.size+' marked ongoing');state.selected.clear();render()" title="No due date needed">∞ Ongoing</button>

function bulkStatusMenuFromBar(event){
  event.stopPropagation();
  const r = event.target.getBoundingClientRect();
  bulkStatusMenu(r.left, r.top - 200);
}
function bulkProjectMenuFromBar(event){
  event.stopPropagation();
  const r = event.target.getBoundingClientRect();
  bulkProjectMenu(r.left, r.top - 300);
}
function bulkArchiveConfirm(){
  const sel = state.selected;
  if(sel.size === 0) return;
  if(!confirm('Archive '+sel.size+' actions? (recoverable from archive)')) return;
  sel.forEach(id => {
    const a = state.actions.find(x => x.id === id);
    if(a){ state.archived.push({...a, archivedAt: todayISO()}); }
  });
  state.actions = state.actions.filter(a => !sel.has(a.id));
  sel.clear();
  saveState();
  render();
  toast('Archived');
}
function bulkDeleteForever(){
  const sel = state.selected;
  if(sel.size === 0) return;
  if(!confirm('Delete '+sel.size+' actions FOREVER? This cannot be undone.')) return;
  state.actions = state.actions.filter(a => !sel.has(a.id));
  state.archived = state.archived.filter(a => !sel.has(a.id));
  sel.clear();
  saveState();
  render();
  toast('Deleted permanently');
}

// ═══ BULK CONTEXT MENU ═══
function showBulkMenu(event){
  event.preventDefault();
  const sel=state.selected;
  if(!sel||sel.size===0) return;
  // Remove any existing menu
  document.getElementById('ctx-menu')?.remove();
  const menu=document.createElement('div');menu.id='ctx-menu';
  menu.style.cssText='position:fixed;z-index:2000;background:var(--card-solid);border:1px solid var(--border-vis);border-radius:var(--radius-sm);box-shadow:var(--shadow-lg);padding:4px;min-width:180px;font-family:var(--font);animation:scaleIn .12s ease-out;left:'+event.clientX+'px;top:'+event.clientY+'px';
  const items=[
    {label:'Change status',sub:true,action:()=>bulkStatusMenu(event.clientX,event.clientY)},
    {label:'Change project',sub:true,action:()=>bulkProjectMenu(event.clientX,event.clientY)},
    {label:'Set priority',action:()=>{sel.forEach(id=>patch(id,{priority:true}));toast(sel.size+' set to priority');sel.clear();render();}},
    {label:'Remove priority',action:()=>{sel.forEach(id=>patch(id,{priority:false}));sel.clear();render();}},
    {label:'Mark as Today Focus',action:()=>{sel.forEach(id=>patch(id,{todayFocus:true}));toast(sel.size+' added to Today');sel.clear();render();}},
    {sep:true},
    {label:'Archive selected',danger:false,action:()=>{if(!confirm('Archive '+sel.size+' actions? (recoverable from archive)'))return;sel.forEach(id=>{const a=state.actions.find(x=>x.id===id);if(a){state.archived.push({...a,archivedAt:todayISO()});}});state.actions=state.actions.filter(a=>!sel.has(a.id));sel.clear();saveState();render();toast('Archived');}},
    {label:'Delete forever',danger:true,action:()=>{if(!confirm('Delete '+sel.size+' actions FOREVER? This cannot be undone.'))return;state.actions=state.actions.filter(a=>!sel.has(a.id));state.archived=state.archived.filter(a=>!sel.has(a.id));sel.clear();saveState();render();toast('Deleted permanently');}},
    {label:'Delete selected',danger:true,action:()=>{if(!confirm('Permanently delete '+sel.size+' actions?'))return;state.actions=state.actions.filter(a=>!sel.has(a.id));sel.clear();saveState();render();toast('Deleted');}}
  ];
  items.forEach(it=>{
    if(it.sep){menu.innerHTML+='<div style="height:1px;background:var(--border);margin:3px 0"></div>';return;}
    const btn=document.createElement('button');
    btn.style.cssText='display:block;width:100%;text-align:left;padding:6px 10px;border:none;background:none;cursor:pointer;font-size:12px;font-family:var(--font);border-radius:6px;color:'+(it.danger?'var(--danger)':'var(--text)');
    btn.textContent=it.label;
    btn.onmouseover=()=>btn.style.background='var(--accent-soft)';
    btn.onmouseout=()=>btn.style.background='none';
    btn.onclick=()=>{menu.remove();it.action();};
    menu.appendChild(btn);
  });
  document.body.appendChild(menu);
  const close=e=>{if(!menu.contains(e.target)){menu.remove();document.removeEventListener('click',close);}};
  setTimeout(()=>document.addEventListener('click',close),10);
}

        ondragend="state.dragProj=null;this.style.opacity='1'"
        ondragover="event.preventDefault();if(state.dragProj)this.style.background='${col}20'"
        ondragleave="this.style.background='${col}0C'"
        ondrop="event.preventDefault();this.style.background='${col}0C';reorderProj('${esc(p)}')"
        onclick="document.getElementById('proj-${p.replace(/\s/g,'')}')?.scrollIntoView({behavior:'smooth',block:'start'})"
        style="display:flex;align-items:stretch;gap:8px;margin-bottom:4px;border-radius:8px;cursor:grab;background:${col}0C;overflow:hidden;transition:all 0.1s">
        <div style="width:4px;background:${col};flex-shrink:0"></div>
        <div style="flex:1;min-width:0;padding:8px 4px 8px 0">
          <div style="font-size:11px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p)}</div>
          <div style="display:flex;align-items:center;gap:4px;margin-top:3px">
            <span style="font-size:9px;color:var(--text-light)">${open} open</span>
            <div style="flex:1;height:2px;background:var(--border);border-radius:1px"><div style="height:2px;background:${col};border-radius:1px;width:${pct}%"></div></div>
          </div>
        </div>
        <button class="btn btn-ghost" style="padding:0 8px;font-size:9px;color:var(--text-light);flex-shrink:0" onclick="event.stopPropagation();deleteProject('${esc(p)}')" title="Delete project">\u2715</button>
      </div>`;
    });
    h += `<button class="btn btn-default" style="width:100%;padding:6px;font-size:10px;margin-top:6px" onclick="createProject()">+ New project</button>
    </div>`;
  }

  h += `<div style="flex:1;min-width:0">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">
      <div class="page-header"><div style="display:flex;align-items:center;gap:8px"><h1>Projects</h1></div></div>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
        <div style="display:flex;background:var(--card);border:1px solid var(--border-vis);border-radius:8px;overflow:hidden">
          <button onclick="state.projView='list';saveState();render()" style="padding:5px 12px;font-size:11px;border:none;cursor:pointer;font-family:var(--font);background:${view==='list'?'var(--accent)':'transparent'};color:${view==='list'?'#fff':'var(--text-mid)'};font-weight:${view==='list'?'600':'400'}">List</button>
          <button onclick="state.projView='cards';saveState();render()" style="padding:5px 12px;font-size:11px;border:none;cursor:pointer;font-family:var(--font);background:${view==='cards'?'var(--accent)':'transparent'};color:${view==='cards'?'#fff':'var(--text-mid)'};font-weight:${view==='cards'?'600':'400'}">Cards</button>
        </div>
        ${view==='list'?`<button class="btn btn-ghost" style="padding:4px 10px;font-size:11px;flex-shrink:0" onclick="state.projSideOpen=!state.projSideOpen;saveState();render()">${sideOpen?'\u25C4 Hide panel':'\u25BA Show panel'}</button>`:''}
      </div>
    </div>`;

  // ═══ CARDS VIEW ═══
  if(view==='cards'){
    h += `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px">`;
    projs.forEach(proj => {
      const items = state.actions.filter(a=>a.project===proj);
      const open = items.filter(a=>a.status!=="Done"&&a.status!=="Cancelled");
      const inProg = items.filter(a=>a.status==="In progress");
      const done = items.filter(a=>a.status==="Done");
      const col = WS_COLORS[proj]||"#94A3B8";
      const od = open.filter(a=>isOverdue(a.due,a.status));
      const pct = items.length?Math.round(done.length/items.length*100):0;
      const subs = getSubs(proj);
      
      h += `<div class="card card-hover" onclick="state.projView='list';state.projCollapsed['${esc(proj)}']=false;saveState();render();setTimeout(()=>document.getElementById('proj-${proj.replace(/\s/g,'')}')?.scrollIntoView({behavior:'smooth',block:'start'}),50)" style="padding:0;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;min-height:150px">
        <div style="height:6px;background:${col}"></div>
        <div style="padding:16px;flex:1;display:flex;flex-direction:column">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:12px">
            <div style="font-size:15px;font-weight:700;line-height:1.3;flex:1">${esc(proj)}</div>
            <button class="btn btn-ghost" style="padding:2px 6px;font-size:11px;color:var(--text-light);flex-shrink:0" onclick="event.stopPropagation();deleteProject('${esc(proj)}')" title="Delete">\u2715</button>
          </div>
          <div style="display:flex;gap:14px;margin-bottom:14px">
            <div><div style="font-size:22px;font-weight:700;color:${col};line-height:1">${open.length}</div><div style="font-size:9px;color:var(--text-light);text-transform:uppercase;letter-spacing:.05em;margin-top:2px">Open</div></div>
            ${inProg.length?`<div><div style="font-size:22px;font-weight:700;color:#3B82F6;line-height:1">${inProg.length}</div><div style="font-size:9px;color:var(--text-light);text-transform:uppercase;letter-spacing:.05em;margin-top:2px">Active</div></div>`:''}
            ${od.length?`<div><div style="font-size:22px;font-weight:700;color:var(--danger);line-height:1">${od.length}</div><div style="font-size:9px;color:var(--text-light);text-transform:uppercase;letter-spacing:.05em;margin-top:2px">Overdue</div></div>`:''}
            <div style="margin-left:auto;text-align:right"><div style="font-size:22px;font-weight:700;color:var(--text-mid);line-height:1">${done.length}</div><div style="font-size:9px;color:var(--text-light);text-transform:uppercase;letter-spacing:.05em;margin-top:2px">Done</div></div>
          </div>
          <div style="margin-top:auto">
            <div style="height:5px;background:var(--border-vis);border-radius:3px;overflow:hidden;margin-bottom:8px"><div style="height:100%;background:${col};border-radius:3px;width:${pct}%;transition:width .4s"></div></div>
            <div style="display:flex;align-items:center;gap:6px;font-size:10px;color:var(--text-light)">
              <span>${pct}% complete</span>
              ${subs.length?`<span>\u00B7 ${subs.length} sub-project${subs.length>1?'s':''}</span>`:''}
              <span style="margin-left:auto;display:flex;gap:4px" onclick="event.stopPropagation()">
                <button style="background:none;border:none;cursor:pointer;font-size:10px;color:${col};font-weight:600;font-family:inherit" onclick="openAddInProject('${esc(proj)}')">+ action</button>
              </span>
            </div>
          </div>
        </div>
      </div>`;
    });
    h += `<div class="card" onclick="createProject()" style="padding:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px dashed var(--border-vis);background:transparent;min-height:150px;color:var(--text-light)"><div style="text-align:center"><div style="font-size:24px;margin-bottom:4px">+</div><div style="font-size:12px;font-weight:600">New project</div></div></div>`;
    h += `</div></div></div>`;
    return h;
  }

  // ═══ LIST VIEW ═══
  projs.forEach(proj => {
    const items = state.actions.filter(a=>a.project===proj);
    const open = items.filter(a=>a.status!=="Done"&&a.status!=="Cancelled");
    const done = items.filter(a=>a.status==="Done");
    const col = WS_COLORS[proj]||"#94A3B8";
    const od = open.filter(a=>isOverdue(a.due,a.status));
    const collapsed = state.projCollapsed[proj];
    const subs = getSubs(proj);

    h += `<div id="proj-${proj.replace(/\s/g,'')}" style="margin-bottom:16px">
      <div onclick="state.projCollapsed[this.dataset.p]=!state.projCollapsed[this.dataset.p];render()" oncontextmenu="event.preventDefault();event.stopPropagation();renameProject('${esc(proj)}')" data-p="${esc(proj)}" ondragover="event.preventDefault();this.style.background=state.dark?'rgba(90,100,180,.1)':'rgba(90,100,180,.06)'" ondragleave="this.style.background=''" ondrop="event.preventDefault();this.style.background='';handleDropToProject('${esc(proj)}','')" style="display:flex;align-items:center;gap:10px;padding:10px 0 10px 12px;cursor:pointer;border-bottom:2px solid ${col};transition:background .1s;position:relative">
        <div style="position:absolute;left:0;top:0;bottom:0;width:4px;background:${col};border-radius:2px"></div>
        <span style="font-size:15px;font-weight:700;flex:1">${esc(proj)}</span>
        <span style="font-size:11px;color:var(--text-light)">${open.length} open</span>
        ${od.length?`<span style="font-size:10px;color:var(--danger);font-weight:700">${od.length} overdue</span>`:""}
        <div style="display:flex;gap:6px" onclick="event.stopPropagation()">
          <button style="background:none;border:none;cursor:pointer;font-size:10px;color:var(--text-mid);font-weight:600;font-family:inherit" onclick="openAddInProject(this.dataset.p)" data-p="${esc(proj)}">+ action</button>
          <button style="background:none;border:none;cursor:pointer;font-size:10px;color:var(--text-mid);font-family:inherit" onclick="promptSub(this.dataset.p)" data-p="${esc(proj)}">+ sub</button>
        </div>
        <span style="font-size:11px;color:var(--text-light);transform:rotate(${collapsed?'-90deg':'0'});transition:transform .15s">\u25BE</span>
      </div>`;

    if (!collapsed) {
      h += `<div class="card" style="border-radius:0 0 8px 8px;overflow:hidden">`;
      const dk=state.dark; const depthColors = dk?['rgba(60,60,100,.15)','rgba(80,65,40,.15)','rgba(40,80,60,.15)','rgba(70,50,80,.15)','rgba(80,50,55,.15)']:['rgba(90,100,180,.06)','rgba(180,140,60,.06)','rgba(60,150,100,.06)','rgba(130,70,160,.06)','rgba(180,60,80,.06)'];
      const depthAccents = [col,'#B8934A','#5A9E7E','#8B72C4','#C57B98'];
      const sorted = [...subs].sort();
      sorted.forEach(sub => {
        // NEW: skip rendering if an ancestor sub is collapsed
        if(isSubHiddenByAncestor(proj,sub)) return;
        const depth = subDepth(sub);
        const subItems = open.filter(a=>a.subproject===sub);
        const dBg = depthColors[depth%depthColors.length];
        const dCol = depthAccents[depth%depthAccents.length];
        const subKey = proj+'//'+sub;
        const subColl = state.subCollapsed[subKey];
        // Does this sub have nested children?
        const childSubs = subs.filter(other=>other!==sub && other.startsWith(sub+' / '));
        const hasChildren = childSubs.length>0;
        // Count direct children (one level deeper only)
        const directChildren = childSubs.filter(c=>subDepth(c)===subDepth(sub)+1).length;
        h += `<div onclick="toggleSubCollapse('${esc(proj)}','${esc(sub)}')" oncontextmenu="event.preventDefault();event.stopPropagation();renameSubProject('${esc(proj)}','${esc(sub)}')" ondragover="event.preventDefault();this.style.background=state.dark?'rgba(90,100,180,.1)':'rgba(90,100,180,.06)'" ondragleave="this.style.background='${dBg}'" ondrop="event.preventDefault();this.style.background='${dBg}';handleDropToProject('${esc(proj)}','${esc(sub)}')" style="display:flex;align-items:center;gap:6px;padding:7px ${16+depth*20}px;background:${dBg};border-bottom:1px solid var(--border);border-left:2px solid ${dCol};transition:background .1s;cursor:pointer">
          ${depth>0?'<span style="color:var(--text-light);font-size:10px">\u2514</span>':''}
          <span style="font-size:10px;color:${dCol};transform:rotate(${subColl?'-90deg':'0'});transition:transform .15s;${(hasChildren||subItems.length)?'':'opacity:.3'}">\u25BE</span>
          <span style="font-size:${depth>0?'11.5':'12.5'}px;font-weight:700;color:${dCol}">${subLabel(sub)}</span>
          <span style="font-size:10px;color:var(--text-light)">${subItems.length?subItems.length+(directChildren?' + '+directChildren+' sub':''):(directChildren?directChildren+' sub'+(directChildren>1?'s':''):'<i style="opacity:.5">empty</i>')}</span>
          <button onclick="event.stopPropagation();promptSub(this.dataset.p,this.dataset.s)" data-p="${esc(proj)}" data-s="${esc(sub)}" style="margin-left:auto;background:none;border:none;cursor:pointer;font-size:9px;color:${dCol};font-weight:600;font-family:inherit">+ sub</button>
          <button onclick="event.stopPropagation();deleteSub('${esc(proj)}','${esc(sub)}')" style="background:none;border:none;cursor:pointer;font-size:9px;color:var(--text-light);font-family:inherit">\u2715</button>
        </div>`;
        if(!subColl) subItems.forEach(a => h += projRow(a, col, depth+1));
      });
      const unassigned = open.filter(a=>!a.subproject);
      if(unassigned.length && subs.length) h += `<div style="padding:6px 16px;background:var(--accent-soft);border-bottom:1px solid var(--border);font-size:11px;font-weight:700;color:var(--text-light)">Unassigned</div>`;
      unassigned.forEach(a => h += projRow(a, col, 0));
      if (done.length) {
        h += `<details style="padding:6px 16px"><summary style="font-size:10.5px;color:var(--text-light);cursor:pointer">${done.length} completed</summary>`;
        done.forEach(a => h += `<div style="font-size:10.5px;color:var(--text-light);padding:1px 0;text-decoration:line-through">${esc(a.action)}</div>`);
        h += `</details>`;
      }
      h += `</div>`;
    }
    h += `</div>`;
  });

  h += `</div></div>`;
  return h;
}
function projRow(a, col, depth) {
  const sel = state.selected.has(a.id);
  return `<div draggable="true" ondragstart="state.dragId='${a.id}';event.dataTransfer.effectAllowed='move'" ondragend="state.dragId=null" ondragover="event.preventDefault();this.style.background=state.dark?'rgba(90,100,180,.1)':'rgba(90,100,180,.06)'" ondragleave="this.style.background='${sel?'var(--accent-soft)':''}'" ondrop="event.preventDefault();this.style.background='';handleReorder(state.dragId,'${a.id}')" onclick="if(event.shiftKey||event.ctrlKey||event.metaKey){event.preventDefault();toggleSelect('${a.id}');return;}openEdit('${a.id}')" oncontextmenu="if(state.selected.size>0){showBulkMenu(event);}else{event.preventDefault();toggleSelect('${a.id}');showBulkMenu(event);}" style="display:flex;align-items:center;gap:5px;padding:6px 6px 6px ${16+depth*20}px;border-bottom:1px solid var(--border);cursor:pointer;font-size:12px;transition:background .08s;background:${sel?'var(--accent-soft)':''}">
    <span style="cursor:grab;color:var(--text-light);font-size:12px;flex-shrink:0" onclick="event.stopPropagation()">\u2847</span>
    ${sel?'<span style="color:var(--accent);font-size:10px">\u2713</span>':''}
    ${a.priority?'<span style="color:#D946EF;font-size:11px">\u2605</span>':''}
    <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:${sel?600:400}">${esc(a.action)}</span>
    <span style="font-size:10.5px;color:var(--text-mid);max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(a.owner)}</span>
    ${statusBadge(a.status)}${actionBtns(a)}</div>`;
}

// IMPORT TAB
// ═══════════════════════════════════════
function renderImport() {
  return `<div class="fade-in"><h1 style="margin-bottom:4px">Import</h1>
    <p style="font-size:12px;color:var(--text-light);margin-bottom:12px">Paste meeting markdown here. For JSON data files, use the <b>JSON Import</b> button in the sidebar.</p>
    <div class="card" style="padding:16px">
      <div style="display:flex;gap:6px;margin-bottom:8px">
        <label class="btn btn-default" style="cursor:pointer">Upload .md<input type="file" accept=".md,.txt" hidden onchange="handleMDUpload(event)"></label>
        <button class="btn btn-primary" onclick="doMDImport()">Import markdown</button>
      </div>
      <textarea id="import-area" class="input" style="width:100%;min-height:250px;font-family:var(--mono);font-size:11.5px;line-height:1.6" placeholder="Paste meeting markdown here...&#10;&#10;### Meeting 18 — 25 Mar 2026: Title&#10;| # | Action | Owner | Due | Measurable Outcome | Project | Status |&#10;|---|--------|-------|-----|-------------------|---------|--------|&#10;| | Do something | Faysal | 1 Apr 2026 | Outcome defined | Project Name | Open |"></textarea>
    </div></div>`;
}
function handleMDUpload(e) {
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=ev=>document.getElementById("import-area").value=ev.target.result; r.readAsText(f);
}
function doMDImport() {
  const md = document.getElementById("import-area").value;
  if (!md.trim()) return;
  const newActions = importMD(md);
  if (!newActions.length) { toast("No actions found"); return; }
  state.actions = [...state.actions, ...newActions];
  state.meetings.push({name:newActions[0]?.meeting||"Import",date:todayISO(),count:newActions.length});
  saveState(); state.tab = "actions"; render();
  toast(newActions.length + " actions imported");
}

function openEdit(id) {
  const a = state.actions.find(x=>x.id===id);
  if (!a) return;
  const projs = getProjects();
  const subs = getSubs(a.project);
  const m = document.createElement("div");
  m.className = "modal-overlay";
  m.onclick = e => { if(e.target===m) m.remove(); };
  m.innerHTML = `<div class="modal">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <h3 style="font-size:15px;font-weight:700">Edit action</h3>
      <div style="display:flex;gap:5px">
        <button class="btn btn-ghost" style="font-size:11px;padding:5px 10px;color:var(--text-mid)" onclick="archiveAction('${a.id}');this.closest('.modal-overlay').remove()" title="Move to archive (recoverable)">Archive</button>
        <button class="btn btn-danger" style="font-size:11px;padding:5px 10px" onclick="deleteActionForever('${a.id}');this.closest('.modal-overlay').remove()" title="Delete permanently">Delete forever</button>
