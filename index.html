      <label style="font-size:10.5px;font-weight:600;color:#5A6578">Owner <input class="input" style="width:100%;margin-top:2px" value="${esc(a.owner)}" onchange="patch('${a.id}',{owner:this.value})"></label>
      <label style="font-size:10.5px;font-weight:600;color:#5A6578">Status <select class="select" style="width:100%;margin-top:2px" onchange="patch('${a.id}',{status:this.value})">${STATUSES.map(s=>`<option ${s===a.status?'selected':''}>${s}</option>`).join("")}</select></label>
      <label style="font-size:10.5px;font-weight:600;color:#5A6578;grid-column:1/-1">Measurable outcome <input class="input" style="width:100%;margin-top:2px" value="${esc(a.measurable||'')}" onchange="patch('${a.id}',{measurable:this.value})"></label>
      <label style="font-size:10.5px;font-weight:600;color:#5A6578">Project <select class="select" style="width:100%;margin-top:2px" onchange="if(this.value==='__new__'){var n=prompt('New project name:');if(n&&n.trim()){addAction({action:'(placeholder \u2014 delete after adding real actions)',owner:'Me',project:n.trim(),status:'Open'});patch('${a.id}',{project:n.trim(),subproject:''});this.closest('.modal-overlay').remove();openEdit('${a.id}');}else{this.value='${esc(a.project)}';}return;}patch('${a.id}',{project:this.value,subproject:''})">${projs.map(p=>`<option ${p===a.project?'selected':''}>${esc(p)}</option>`).join("")}<option value="__new__">+ New project...</option></select></label>
      <label style="font-size:10.5px;font-weight:600;color:#5A6578">Sub-project
        <div style="display:flex;gap:4px;margin-top:2px">
          <select class="select" style="flex:1" onchange="if(this.value==='__new__'){var n=prompt('New sub-project name:');if(n){if(!state.subProjects[a.project])state.subProjects[a.project]=[];state.subProjects[a.project].push(n);patch('${a.id}',{subproject:n});this.closest('.modal-overlay').remove();openEdit('${a.id}');}else{this.value='${esc(a.subproject)}';}return;}patch('${a.id}',{subproject:this.value})">
            <option value="">(none)</option>
            ${subs.map(s=>`<option value="${esc(s)}" ${s===a.subproject?'selected':''}>${"\u00A0".repeat(subDepth(s)*2)+subLabel(s)}</option>`).join("")}
            <option value="__new__">+ New sub-project...</option>
          </select>
        </div></label>
      <div style="grid-column:1/-1"><div style="font-size:10.5px;font-weight:600;color:#5A6578;margin-bottom:4px">Notes</div>
        ${(a.notesLog||[]).length?`<div style="max-height:120px;overflow:auto;margin-bottom:6px;border:1px solid var(--border);border-radius:6px;padding:6px">${(a.notesLog||[]).map(n=>`<div style="font-size:11px;padding:3px 0;border-bottom:1px solid var(--border);display:flex;gap:8px"><span style="color:var(--text-light);font-size:10px;white-space:nowrap">${fmtDate(n.d)}</span><span>${esc(n.t)}</span></div>`).join("")}</div>`:""}

      <div style="grid-column:1/-1;border-top:1px solid var(--border);padding-top:10px;margin-top:4px">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;flex-wrap:wrap">
          <label style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:${a.priority?'#D946EF':'var(--text-mid)'};cursor:pointer">

function submitNewAction(btn){
  const action=document.getElementById('add-action').value.trim();
  if(!action){toast('Action cannot be empty');return;}
  let proj=document.getElementById('add-proj').value;
  if(proj==='__new__'){
    proj=document.getElementById('add-newproj').value.trim();
    if(!proj){toast('Enter project name');return;}
  }
  let sub=document.getElementById('add-sub').value;
  if(sub==='__new__'){
    sub=prompt('New sub-project name:');
    if(sub){if(!state.subProjects[proj])state.subProjects[proj]=[];state.subProjects[proj].push(sub);}
    else sub='';
  }
  addAction({
    num:document.getElementById('add-num').value,
    action:action,
    owner:document.getElementById('add-owner').value||'Me',
    due:document.getElementById('add-due').value,
    project:proj,
    subproject:sub||'',
    status:document.getElementById('add-status').value,
    measurable:document.getElementById('add-measurable').value,
    priority:document.getElementById('add-prio').checked,
    todayFocus:document.getElementById('add-today').checked,
    recur:document.getElementById('add-recur').value||''
  });
  btn.closest('.modal-overlay').remove();
}

state.calMonth = new Date().getMonth();
state.calYear = new Date().getFullYear();
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
function renderCalendar() {
  const m=state.calMonth, y=state.calYear;
  const first=new Date(y,m,1), last=new Date(y,m+1,0);
  let startDay=(first.getDay()+6)%7; // Monday=0
  const daysInMonth=last.getDate();
  const todayStr=todayISO();
  // Get actions with due dates this month
  const monthActions={};
  state.actions.forEach(a=>{if(a.due&&a.due.startsWith(`${y}-${String(m+1).padStart(2,'0')}`)){const d=parseInt(a.due.slice(8));if(!monthActions[d])monthActions[d]=[];monthActions[d].push(a);}});

  let h=`<div class="fade-in"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <h1>Calendar</h1>
    <div style="display:flex;gap:5px;align-items:center">
      <button class="btn btn-default" style="padding:5px 10px" onclick="state.calMonth===0?(state.calMonth=11,state.calYear--):state.calMonth--;render()">\u25C0</button>
      <span style="font-size:14px;font-weight:700;min-width:150px;text-align:center">${MONTHS[m]} ${y}</span>
      <button class="btn btn-default" style="padding:5px 10px" onclick="state.calMonth===11?(state.calMonth=0,state.calYear++):state.calMonth++;render()">\u25B6</button>
    </div></div>`;
  h+=`<div class="card" style="overflow:hidden"><div style="display:grid;grid-template-columns:repeat(7,1fr)">`;
  DAYS.forEach(d=>h+=`<div style="padding:8px;font-size:10px;font-weight:700;text-align:center;color:var(--text-light);text-transform:uppercase;background:#F9FAFB;border-bottom:1px solid var(--border)">${d}</div>`);
  for(let i=0;i<startDay;i++)h+=`<div style="padding:8px;border-bottom:1px solid var(--border);min-height:80px;background:rgba(0,0,0,.01)"></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const dateStr=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday=dateStr===todayStr;
    const acts=monthActions[d]||[];
    h+=`<div style="padding:6px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);min-height:80px;${isToday?'background:var(--accent-soft)':''}">
      <div style="font-size:11px;font-weight:${isToday?700:500};color:${isToday?'var(--accent)':'var(--text)'};margin-bottom:4px">${d}</div>`;
    acts.slice(0,3).forEach(a=>{
      const c=WS_COLORS[a.project]||"#94A3B8";
      h+=`<div onclick="openEdit('${a.id}')" style="font-size:9.5px;padding:2px 4px;margin-bottom:2px;border-radius:3px;background:${c}14;color:${c};cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;border-left:2px solid ${c}">${esc(a.action).slice(0,25)}</div>`;
    });
    if(acts.length>3)h+=`<div style="font-size:9px;color:var(--text-light)">+${acts.length-3} more</div>`;
    h+=`</div>`;
  }
  const totalCells=startDay+daysInMonth;
  for(let i=totalCells;i%7!==0;i++)h+=`<div style="padding:8px;border-bottom:1px solid var(--border);min-height:80px;background:rgba(0,0,0,.01)"></div>`;
  h+=`</div></div></div>`;
  return h;
}

window.addEventListener('beforeunload',()=>{
  if(gdriveEnabled && syncDebounceTimer){
    clearTimeout(syncDebounceTimer);
    // Fire a synchronous-ish save (best effort; browsers may not await async here)
    try{ saveToDrive(); }catch(e){}
  }
});
window.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden' && gdriveEnabled && syncDebounceTimer){
    clearTimeout(syncDebounceTimer);
    try{ saveToDrive(); }catch(e){}
  }
});

document.addEventListener('keydown',e=>{
  // Guard: don't fire shortcuts when user is typing in any input/textarea/select
  const tag=e.target.tagName;
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT')return;
  if(e.target.isContentEditable)return;
  if(e.isComposing)return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='n'){e.preventDefault();openAddModal();}
  if(e.key==='t'){e.preventDefault();state.tab='today';render();}
  if(e.key==='i'){e.preventDefault();state.tab='inbox';render();}
  if(e.key==='a'){e.preventDefault();state.tab='actions';render();}
  if(e.key==='p'){e.preventDefault();state.tab='projects';render();}
  if(e.key==='/'){e.preventDefault();state.tab='actions';render();setTimeout(()=>{const s=document.getElementById('search-input');if(s)s.focus();},100);}
  if(e.key==='d'){e.preventDefault();toggleDark();}
});

function exportMD() {
  const projs=getProjects();
  let md=`# Action Tracker — Status Report\n**Date:** ${new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"})}\n\n`;
  const s=getStats();
  md+=`**Summary:** ${s.total} total, ${s.done} done (${s.pct}%), ${s.overdue} overdue, ${s.prio} priority\n\n`;
  projs.forEach(p=>{
    const items=state.actions.filter(a=>a.project===p);
    const open=items.filter(a=>a.status!=="Done"&&a.status!=="Cancelled");
    if(!open.length)return;
    md+=`## ${p}\n\n| Action | Owner | Due | Status |\n|--------|-------|-----|--------|\n`;
    open.forEach(a=>md+=`| ${a.action} | ${a.owner} | ${a.due?fmtDate(a.due):'TBD'} | ${a.status} |\n`);
    md+='\n';
  });
  const blob=new Blob([md],{type:'text/markdown'});
  Object.assign(document.createElement('a'),{href:URL.createObjectURL(blob),download:'tracker_report_'+todayISO()+'.md'}).click();
  toast('Report exported');
}
